            - paragraph [ref=f11e362]:
              - text: OpenAI is an American
              - link "artificial intelligence" [ref=f11e363] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_intelligence
              - text: (AI) research organization headquartered in
              - link "San Francisco" [ref=f11e364] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/San_Francisco
              - text: ", consisting of OpenAI Group PBC, a for-profit public"
              - link "benefit corporation" [ref=f11e365] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Benefit_corporation
              - text: (PBC), partially controlled by OpenAI Foundation, a
              - link "nonprofit" [ref=f11e366] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nonprofit
              - text: . OpenAI develops
              - link "generative AI" [ref=f11e367] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Generative_AI
              - text: models, particularly the
              - link "GPT series" [ref=f11e368] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GPT_(OpenAI_model)
              - text: of
              - link "large language models" [ref=f11e369] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Large_language_model
              - text: . Its release of
              - link "ChatGPT" [ref=f11e370] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ChatGPT
              - text: in November 2022 has been credited with catalyzing the
              - link "AI boom" [ref=f11e371] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/AI_boom
              - text: ", and widespread interest in generative AI."
            - paragraph [ref=f11e372]:
              - text: OpenAI was founded in 2015 in
              - link "Delaware" [ref=f11e373] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Delaware_General_Corporation_Law
              - text: as a nonprofit. A for-profit subsidiary of the nonprofit was created in 2019, and a 2025 restructuring converted the subsidiary into a PBC that is 26% owned by the nonprofit.
              - link "Microsoft" [ref=f11e374] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft
              - text: previously invested over $13 billion into OpenAI,
              - superscript [ref=f11e375]:
                - link "[9]" [ref=f11e376] [cursor=pointer]:
                  - /url: "#cite_note-Reuters_2025-10"
              - text: and provides
              - link "Azure" [ref=f11e378] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft_Azure
              - text: cloud computing resources.
              - superscript [ref=f11e379]:
                - link "[10]" [ref=f11e380] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: In October 2025, OpenAI conducted a $6.6 billion share sale that valued the company at $500 billion.
              - superscript [ref=f11e382]:
                - link "[11]" [ref=f11e383] [cursor=pointer]:
                  - /url: "#cite_note-12"
            - paragraph [ref=f11e385]:
              - text: In 2023 and 2024, OpenAI faced multiple lawsuits for alleged
              - link "copyright infringement" [ref=f11e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Copyright_infringement
              - text: against authors and media companies whose work was used to train some of OpenAI's products. In November 2023, OpenAI's board
              - link "removed Sam Altman" [ref=f11e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Removal_of_Sam_Altman_from_OpenAI
              - text: as CEO, citing a lack of confidence in him, but reinstated him five days later following a reconstruction of the board. Throughout 2024, roughly half of then-employed
              - link "AI safety" [ref=f11e388] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/AI_safety
              - text: researchers left OpenAI, citing the company's deprioritization of safety goals.
              - superscript [ref=f11e389]:
                - link "[12]" [ref=f11e390] [cursor=pointer]:
                  - /url: "#cite_note-13"
              - superscript [ref=f11e392]:
                - link "[13]" [ref=f11e393] [cursor=pointer]:
                  - /url: "#cite_note-14"
