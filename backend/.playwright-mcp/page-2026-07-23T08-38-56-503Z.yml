                - heading "Principal individual investors" [level=3] [ref=f11e1485]
                - generic [ref=f11e1486]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=22
              - list [ref=f11e1487]:
                - listitem [ref=f11e1488]:
                  - link "Elon Musk" [ref=f11e1489] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Elon_Musk
