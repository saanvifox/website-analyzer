                    - /url: https://en.wikipedia.org/wiki/Peter_Thiel
                  - text: ","
                  - link "PayPal" [ref=f11e1495] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/PayPal
                  - text: co-founder
                  - superscript [ref=f11e1496]:
                    - link "[205]" [ref=f11e1497] [cursor=pointer]:
                      - /url: "#cite_note-mercury-back-206"
                - listitem [ref=f11e1499]:
                  - link "Jessica Livingston" [ref=f11e1500] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Jessica_Livingston
                  - text: ", a founding partner of Y Combinator"
                  - superscript [ref=f11e1501]:
                    - link "[193]" [ref=f11e1502] [cursor=pointer]:
                      - /url: "#cite_note-seattle-investors-194"
                - listitem [ref=f11e1504]:
                  - link "Reid Hoffman" [ref=f11e1505] [cursor=pointer]:
