                  - /url: https://en.wikipedia.org/wiki/Pioneer_Building_(San_Francisco)
                - text: in San Francisco
            - paragraph [ref=f11e404]:
              - text: In December 2015, OpenAI was founded as the
              - link "nonprofit organization" [ref=f11e405] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nonprofit_organization
              - text: OpenAI, Inc.,
              - superscript [ref=f11e406]:
                - link "[14]" [ref=f11e407] [cursor=pointer]:
                  - /url: "#cite_note-Ostrovsky-2025-15"
              - text: by
              - link "Elon Musk" [ref=f11e409] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Elon_Musk
              - text: ","
              - link "Sam Altman" [ref=f11e410] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sam_Altman
              - text: ","
              - link "Ilya Sutskever" [ref=f11e411] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ilya_Sutskever
              - text: ","
              - link "Greg Brockman" [ref=f11e412] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Greg_Brockman
              - text: ","
              - link "Trevor Blackwell" [ref=f11e413] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Trevor_Blackwell
              - text: ", Vicki Cheung,"
              - link "Andrej Karpathy" [ref=f11e414] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Andrej_Karpathy
              - text: ","
              - link "Durk Kingma" [ref=f11e415] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Durk_Kingma
              - text: ","
              - link "John Schulman" [ref=f11e416] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/John_Schulman
              - text: ", Pamela Vagata, and"
              - link "Wojciech Zaremba" [ref=f11e417] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wojciech_Zaremba
              - text: ", with Elon Musk and Sam Altman as the co-chairs."
              - superscript [ref=f11e418]:
                - link "[15]" [ref=f11e419] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - superscript [ref=f11e421]:
                - link "[16]" [ref=f11e422] [cursor=pointer]:
                  - /url: "#cite_note-17"
              - text: A total of $1 billion in capital was pledged by Elon Musk, Sam Altman, Greg Brockman,
              - link "Reid Hoffman" [ref=f11e424] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Reid_Hoffman
              - text: ","
              - link "Jessica Livingston" [ref=f11e425] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Jessica_Livingston
              - text: ","
              - link "Peter Thiel" [ref=f11e426] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Peter_Thiel
              - text: ","
              - link "Amazon Web Services" [ref=f11e427] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Amazon_Web_Services
              - text: (AWS), and
              - link "Infosys" [ref=f11e428] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Infosys
              - text: .
              - superscript [ref=f11e429]:
                - link "[17]" [ref=f11e430] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - superscript [ref=f11e432]:
                - link "[18]" [ref=f11e433] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: However, the actual capital collected significantly lagged pledges. According to tax filings, only $133.2 million had been received by 2021.
              - superscript [ref=f11e435]:
                - link "[19]" [ref=f11e436] [cursor=pointer]:
                  - /url: "#cite_note-20"
            - paragraph [ref=f11e438]:
              - text: Elon Musk stated in 2015 that he was partly motivated by concerns about
              - link "AI safety" [ref=f11e439] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/AI_safety
              - text: and
              - link "existential risk from artificial general intelligence" [ref=f11e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Existential_risk_from_artificial_general_intelligence
              - text: .
              - superscript [ref=f11e441]:
                - link "[20]" [ref=f11e442] [cursor=pointer]:
                  - /url: "#cite_note-csmonitor-21"
              - superscript [ref=f11e444]:
                - link "[15]" [ref=f11e445] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - text: OpenAI stated that "it's hard to fathom how much human-level AI could benefit society", and that it is equally difficult to comprehend "how much it could damage society if built or used incorrectly".
              - superscript [ref=f11e447]:
                - link "[21]" [ref=f11e448] [cursor=pointer]:
                  - /url: "#cite_note-bbc-giants-22"
              - text: The startup also wrote that AI "should be an extension of individual human wills and, in the spirit of liberty, as broadly and evenly distributed as possible",
              - superscript [ref=f11e450]:
                - link "[21]" [ref=f11e451] [cursor=pointer]:
                  - /url: "#cite_note-bbc-giants-22"
              - text: and that "because of AI's surprising history, it's hard to predict when human-level AI might come within reach. When it does, it'll be important to have a leading research institution which can prioritize a good outcome for all over its own self-interest."
              - superscript [ref=f11e453]:
                - link "[22]" [ref=f11e454] [cursor=pointer]:
                  - /url: "#cite_note-23"
              - text: Co-chair Sam Altman expected a decades-long project that eventually surpasses human intelligence.
              - superscript [ref=f11e456]:
                - link "[23]" [ref=f11e457] [cursor=pointer]:
                  - /url: "#cite_note-wired_far_more-24"
            - paragraph [ref=f11e459]:
              - text: In its founding charter, OpenAI defined its mission as ensuring that
              - link "artificial general intelligence" [ref=f11e460] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_general_intelligence
              - text: (AGI) "benefits all of humanity",
              - superscript [ref=f11e461]:
                - link "[24]" [ref=f11e462] [cursor=pointer]:
                  - /url: "#cite_note-Booth-2025-25"
              - text: and stated an intention to collaborate openly with other institutions by making certain patents and research publicly available, but later restricted access to its most capable models, citing competitive and safety concerns.
              - superscript [ref=f11e464]:
                - link "[25]" [ref=f11e465] [cursor=pointer]:
                  - /url: "#cite_note-26"
              - superscript [ref=f11e467]:
                - link "[21]" [ref=f11e468] [cursor=pointer]:
                  - /url: "#cite_note-bbc-giants-22"
              - superscript [ref=f11e470]:
                - link "[15]" [ref=f11e471] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - text: OpenAI was initially run from Brockman's living room.
              - superscript [ref=f11e473]:
                - link "[26]" [ref=f11e474] [cursor=pointer]:
                  - /url: "#cite_note-27"
              - text: It was later headquartered at the
              - link "Pioneer Building" [ref=f11e476] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pioneer_Building_(San_Francisco)
              - text: in the
              - link "Mission District, San Francisco" [ref=f11e477] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mission_District,_San_Francisco
              - text: .
              - superscript [ref=f11e478]:
                - link "[27]" [ref=f11e479] [cursor=pointer]:
                  - /url: "#cite_note-28"
              - superscript [ref=f11e481]:
                - link "[28]" [ref=f11e482] [cursor=pointer]:
                  - /url: "#cite_note-technologyreview-29"
            - paragraph [ref=f11e484]:
              - text: Brockman met with
              - link "Yoshua Bengio" [ref=f11e485] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Yoshua_Bengio
              - text: ", one of the \"founding fathers\" of"
              - link "deep learning" [ref=f11e486] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Deep_learning
              - text: ", and drew up a list of great AI researchers."
              - superscript [ref=f11e487]:
                - link "[15]" [ref=f11e488] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - text: Brockman was able to hire nine of them as the first employees in December 2015.
              - superscript [ref=f11e490]:
                - link "[15]" [ref=f11e491] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - text: OpenAI did not pay AI researchers salaries comparable to those of
              - link "Facebook" [ref=f11e493] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Facebook
              - text: or
              - link "Google" [ref=f11e494] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Google
              - text: .
              - superscript [ref=f11e495]:
                - link "[15]" [ref=f11e496] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - text: It also did not pay stock options which AI researchers typically get. Nevertheless, OpenAI spent $7 million on its first 52 employees in 2016.
              - superscript [ref=f11e498]:
                - link "[29]" [ref=f11e499] [cursor=pointer]:
                  - /url: "#cite_note-salaryTimes-30"
              - text: OpenAI's potential and mission drew these researchers to the firm; a Google employee said he was willing to leave Google for OpenAI "partly because of the very strong group of people and, to a very large extent, because of its mission."
              - superscript [ref=f11e501]:
                - link "[15]" [ref=f11e502] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
              - text: OpenAI co-founder
              - link "Wojciech Zaremba" [ref=f11e504] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wojciech_Zaremba
              - text: stated that he turned down "borderline crazy" offers of two to three times his market value to join OpenAI instead.
              - superscript [ref=f11e505]:
                - link "[15]" [ref=f11e506] [cursor=pointer]:
                  - /url: "#cite_note-wired_inside-16"
            - paragraph [ref=f11e508]:
              - text: In April 2016, OpenAI released a public beta of "OpenAI Gym", its platform for
              - link "reinforcement learning" [ref=f11e509] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Reinforcement_learning
              - text: research.
              - superscript [ref=f11e510]:
                - link "[30]" [ref=f11e511] [cursor=pointer]:
                  - /url: "#cite_note-Dave_Gershgorn-2016-31"
              - link "Nvidia" [ref=f11e513] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nvidia
              - text: gifted its first
              - link "DGX-1 supercomputer" [ref=f11e514] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nvidia_DGX
              - text: to OpenAI in August 2016 to help it train larger and more complex AI models with the capability of reducing processing time from six days to two hours.
              - superscript [ref=f11e515]:
                - link "[31]" [ref=f11e516] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - superscript [ref=f11e518]:
                - link "[32]" [ref=f11e519] [cursor=pointer]:
                  - /url: "#cite_note-33"
              - text: In December 2016, OpenAI released "Universe", a software platform for measuring and training an AI's general intelligence across the world's supply of games, websites, and other applications.
              - superscript [ref=f11e521]:
                - link "[33]" [ref=f11e522] [cursor=pointer]:
                  - /url: "#cite_note-34"
              - superscript [ref=f11e524]:
                - link "[34]" [ref=f11e525] [cursor=pointer]:
                  - /url: "#cite_note-35"
              - superscript [ref=f11e527]:
                - link "[35]" [ref=f11e528] [cursor=pointer]:
                  - /url: "#cite_note-36"
              - superscript [ref=f11e530]:
                - link "[36]" [ref=f11e531] [cursor=pointer]:
                  - /url: "#cite_note-37"
          - region [ref=f11e533]:
            - generic [ref=f11e534]:
              - heading "Corporate structure" [level=2] [ref=f11e535]
              - generic [ref=f11e536]:
                - link "edit":
                  - /url: /w/index.php?title=OpenAI&action=edit&section=2
            - region [ref=f11e537]:
              - generic [ref=f11e538]:
                - heading "Transition from nonprofit" [level=3] [ref=f11e539]
                - generic [ref=f11e540]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=3
              - region [ref=f11e541]:
                - generic [ref=f11e542]:
                  - heading "Creation of for-profit subsidiaries (2019)" [level=4] [ref=f11e543]
                  - generic [ref=f11e544]:
                    - link "edit":
                      - /url: /w/index.php?title=OpenAI&action=edit&section=4
                - paragraph [ref=f11e545]:
                  - text: In 2019, OpenAI transitioned from nonprofit to "capped" for-profit, with the profit being capped at 100 times any investment.
                  - superscript [ref=f11e546]:
                    - link "[37]" [ref=f11e547] [cursor=pointer]:
                      - /url: "#cite_note-38"
                  - text: OpenAI formed three
                  - link "subsidiaries" [ref=f11e549] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Subsidiaries
                  - text: ": the"
                  - link "holding company" [ref=f11e550] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Holding_company
                  - text: OpenAI LP, the holding company OpenAI GP LLC, and the capped for-profit company OpenAI Global, LLC. The holding company OpenAI LP was owned by the nonprofit OpenAI, Inc., OpenAI employees, and investors, whereas OpenAI Global, LLC, was owned by OpenAI LP and Microsoft, the latter of which had a minority non-voting stake. The nonprofit OpenAI, Inc., controlled OpenAI GP LLC, which in turn controlled OpenAI LP and OpenAI Global, LLC.
                  - superscript [ref=f11e551]:
                    - link "[38]" [ref=f11e552] [cursor=pointer]:
                      - /url: "#cite_note-Fan-2025-39"
                  - superscript [ref=f11e554]:
                    - 'generic "Page / location: 1050–1051" [ref=f11e555]': ": 1050–1051"
                - paragraph [ref=f11e556]:
                  - text: OpenAI stated that the capped-profit model would allow it to legally attract investment from venture funds and compensate employees with
                  - link "equity" [ref=f11e557] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Equity_(finance)
                  - text: as competing AI companies did.
                  - superscript [ref=f11e558]:
                    - link "[39]" [ref=f11e559] [cursor=pointer]:
                      - /url: "#cite_note-wired_investors-40"
                  - superscript [ref=f11e561]:
                    - link "[40]" [ref=f11e562] [cursor=pointer]:
                      - /url: "#cite_note-bloomberg_arm-41"
                  - text: Microsoft subsequently invested $1 billion in OpenAI LP, and OpenAI's services were migrated to
                  - link "Microsoft Azure" [ref=f11e564] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Microsoft_Azure
                  - text: .
                  - superscript [ref=f11e565]:
                    - link "[41]" [ref=f11e566] [cursor=pointer]:
                      - /url: "#cite_note-Foley-2019-42"
                  - text: Since then, OpenAI systems have run on an Azure-based
                  - link "supercomputing" [ref=f11e568] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Supercomputing
                  - text: platform.
                  - superscript [ref=f11e569]:
                    - link "[42]" [ref=f11e570] [cursor=pointer]:
                      - /url: "#cite_note-Foley_2020-43"
                  - superscript [ref=f11e572]:
                    - link "[43]" [ref=f11e573] [cursor=pointer]:
                      - /url: "#cite_note-Engadget_2020-44"
                - paragraph [ref=f11e575]:
                  - text: The 2019 restructuring made the nonprofit OpenAI, Inc., the only
                  - link "controlling shareholder" [ref=f11e576] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Controlling_interest
                  - text: of OpenAI LP, which retained a formal
                  - link "fiduciary responsibility" [ref=f11e577] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Fiduciary_duty
                  - text: to OpenAI, Inc.'s nonprofit charter. A majority of OpenAI, Inc.'s board was barred from having financial stakes in OpenAI LP.
                  - superscript [ref=f11e578]:
                    - link "[39]" [ref=f11e579] [cursor=pointer]:
                      - /url: "#cite_note-wired_investors-40"
                  - text: In addition, minority members with a stake in OpenAI LP were barred from certain votes due to conflict of interest.
                  - superscript [ref=f11e581]:
                    - link "[40]" [ref=f11e582] [cursor=pointer]:
                      - /url: "#cite_note-bloomberg_arm-41"
                  - text: Some researchers have argued that OpenAI's switch to for-profit status was inconsistent with OpenAI's claims to be "democratizing" AI.
                  - superscript [ref=f11e584]:
                    - link "[44]" [ref=f11e585] [cursor=pointer]:
                      - /url: "#cite_note-45"
              - region [ref=f11e587]:
                - generic [ref=f11e588]:
                  - heading "Conversion to public benefit corporation (2025)" [level=4] [ref=f11e589]
                  - generic [ref=f11e590]:
                    - link "edit":
                      - /url: /w/index.php?title=OpenAI&action=edit&section=5
                - figure "OpenAI's corporate structure, as of May 2026" [ref=f11e591]:
                  - link [ref=f11e592] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:OpenAI_corporate_structure_revised.svg
                - paragraph [ref=f11e595]:
                  - text: In December 2024, OpenAI proposed a restructuring plan to convert the capped-profit into a Delaware-based public
                  - link "benefit corporation" [ref=f11e596] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Benefit_corporation
                  - text: (PBC), remove its profit cap, and release it from the control of the nonprofit.
                  - superscript [ref=f11e597]:
                    - link "[38]" [ref=f11e598] [cursor=pointer]:
                      - /url: "#cite_note-Fan-2025-39"
                  - superscript [ref=f11e600]:
                    - 'generic "Page / location: 1053" [ref=f11e601]': ": 1053"
                  - text: The nonprofit would sell its control and other assets, getting equity in return, and would use it to fund and pursue separate charitable projects, including in science and education. OpenAI's leadership described the change as necessary to secure additional investments, and claimed that the nonprofit's founding mission to ensure AGI "benefits all of humanity" would be better fulfilled.
                  - superscript [ref=f11e602]:
                    - link "[24]" [ref=f11e603] [cursor=pointer]:
                      - /url: "#cite_note-Booth-2025-25"
                - paragraph [ref=f11e605]:
                  - text: The plan has been criticized by former employees. A legal letter named "Not For Private Gain" asked the
                  - link "attorneys general of California" [ref=f11e606] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Attorney_General_of_California
                  - text: and
                  - link "Delaware" [ref=f11e607] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Attorney_General_of_Delaware
                  - text: to intervene, stating that the restructuring is illegal and would remove governance safeguards from the nonprofit and the attorneys general.
                  - superscript [ref=f11e608]:
                    - link "[45]" [ref=f11e609] [cursor=pointer]:
                      - /url: "#cite_note-46"
                  - superscript [ref=f11e611]:
                    - link "[46]" [ref=f11e612] [cursor=pointer]:
                      - /url: "#cite_note-47"
                  - text: The letter argues that OpenAI's complex structure was deliberately designed to remain accountable to its mission, without the conflicting pressure of maximizing profits. It contends that the nonprofit is best positioned to advance its mission of ensuring AGI benefits all of humanity by continuing to control OpenAI Global, LLC, whatever the amount of equity that it could get in exchange.
                  - superscript [ref=f11e614]:
                    - link "[47]" [ref=f11e615] [cursor=pointer]:
                      - /url: "#cite_note-Piper-2025-48"
                  - text: PBCs can choose how they balance their mission with profit-making. Controlling shareholders have a large influence on how closely a PBC sticks to its mission.
                  - superscript [ref=f11e617]:
                    - link "[48]" [ref=f11e618] [cursor=pointer]:
                      - /url: "#cite_note-Reuters-2025-49"
                  - superscript [ref=f11e620]:
                    - link "[47]" [ref=f11e621] [cursor=pointer]:
                      - /url: "#cite_note-Piper-2025-48"
                  - text: OpenAI subpoenaed six nonprofit organizations that opposed its for-profit transition, which the organizations described as an attempt to silence them.
                  - superscript [ref=f11e623]:
                    - link "[49]" [ref=f11e624] [cursor=pointer]:
                      - /url: "#cite_note-Perlo-2025-50"
                  - superscript [ref=f11e626]:
                    - link "[50]" [ref=f11e627] [cursor=pointer]:
                      - /url: "#cite_note-Shugerman-2025-51"
                - paragraph [ref=f11e629]:
                  - text: On October 28, 2025, OpenAI announced that it had adopted the new PBC corporate structure after receiving approval from the attorneys general of California and Delaware.
                  - superscript [ref=f11e630]:
                    - link "[7]" [ref=f11e631] [cursor=pointer]:
                      - /url: "#cite_note-nyt-restructure-8"
                  - text: Under the new structure, OpenAI's for-profit branch became a public benefit corporation known as OpenAI Group PBC, while the nonprofit was renamed to the OpenAI Foundation.
                  - superscript [ref=f11e633]:
                    - link "[7]" [ref=f11e634] [cursor=pointer]:
                      - /url: "#cite_note-nyt-restructure-8"
                  - superscript [ref=f11e636]:
                    - link "[51]" [ref=f11e637] [cursor=pointer]:
                      - /url: "#cite_note-reuters-restructure-52"
                  - text: The OpenAI Foundation holds a 26% stake in the PBC, while Microsoft holds a 27% stake and the remaining 47% is owned by employees and other investors.
                  - superscript [ref=f11e639]:
                    - link "[7]" [ref=f11e640] [cursor=pointer]:
                      - /url: "#cite_note-nyt-restructure-8"
                  - superscript [ref=f11e642]:
                    - link "[52]" [ref=f11e643] [cursor=pointer]:
                      - /url: "#cite_note-cnbc-restructure-53"
                - paragraph [ref=f11e645]:
                  - text: All members of the OpenAI Group PBC board of directors are to be appointed by the OpenAI Foundation, which can remove them at any time.
                  - superscript [ref=f11e646]:
                    - link "[7]" [ref=f11e647] [cursor=pointer]:
                      - /url: "#cite_note-nyt-restructure-8"
                  - text: As of April 2026, all but one of the board members of the OpenAI Foundation were also board members of OpenAI Group PBC.
                  - superscript [ref=f11e649]:
                    - link "[53]" [ref=f11e650] [cursor=pointer]:
                      - /url: "#cite_note-Farrow-2026-54"
                  - text: In April 2026, co-founder Musk revised
                  - link "his lawsuit against OpenAI and Altman" [ref=f11e652] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Musk_v._Altman
                  - text: to seek the reversal of OpenAI's corporate restructuring.
                  - superscript [ref=f11e653]:
                    - link "[54]" [ref=f11e654] [cursor=pointer]:
                      - /url: "#cite_note-Belanger-2026-55"
                  - text: Musk lost the lawsuit in May 2026, with the jury concluding that he waited beyond the three-year
                  - link "statute of limitations" [ref=f11e656] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Statute_of_limitations
                  - text: to sue OpenAI.
                  - superscript [ref=f11e657]:
                    - link "[55]" [ref=f11e658] [cursor=pointer]:
                      - /url: "#cite_note-56"
                  - text: Also in May 2026, Bloomberg reported that OpenAI was preparing to confidentially file its IPO, seeking to publicly debut in the Fall of that same year.
                  - superscript [ref=f11e660]:
                    - link "[56]" [ref=f11e661] [cursor=pointer]:
                      - /url: "#cite_note-57"
            - region [ref=f11e663]:
              - generic [ref=f11e664]:
                - heading "Partnership with Microsoft" [level=3] [ref=f11e665]
                - generic [ref=f11e666]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=6
              - paragraph [ref=f11e667]:
                - text: Following its original $1 billion investment in 2019, Microsoft invested another $2 billion through 2022.
                - superscript [ref=f11e668]:
                  - link "[57]" [ref=f11e669] [cursor=pointer]:
                    - /url: "#cite_note-58"
                - text: On January 23, 2023, Microsoft announced an additional US$10 billion investment in OpenAI over multiple years, of which a significant portion would be used to purchase compute on
                - link "Microsoft Azure" [ref=f11e671] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Azure
                - text: .
                - superscript [ref=f11e672]:
                  - link "[58]" [ref=f11e673] [cursor=pointer]:
                    - /url: "#cite_note-59"
                - superscript [ref=f11e675]:
                  - link "[59]" [ref=f11e676] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - text: These investments were made at a $29 billion valuation, double OpenAI's 2021 valuation.
                - superscript [ref=f11e678]:
                  - link "[60]" [ref=f11e679] [cursor=pointer]:
                    - /url: "#cite_note-61"
                - text: Later that year, Microsoft began using OpenAI models for its
                - link "Copilot" [ref=f11e681] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Copilot
                - text: chatbot, integrated Copilot into
                - link "Windows" [ref=f11e682] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Windows
                - text: ", and released mobile Copilot apps."
                - superscript [ref=f11e683]:
                  - link "[61]" [ref=f11e684] [cursor=pointer]:
                    - /url: "#cite_note-unify-62"
                - superscript [ref=f11e686]:
                  - link "[62]" [ref=f11e687] [cursor=pointer]:
                    - /url: "#cite_note-androidlaunch-63"
                - superscript [ref=f11e689]:
                  - link "[63]" [ref=f11e690] [cursor=pointer]:
                    - /url: "#cite_note-ioslaunch-64"
              - paragraph [ref=f11e692]:
                - text: Following OpenAI's 2025 restructuring, Microsoft owned a 27% stake in the for-profit OpenAI Group PBC, valued at $135 billion.
                - superscript [ref=f11e693]:
                  - link "[52]" [ref=f11e694] [cursor=pointer]:
                    - /url: "#cite_note-cnbc-restructure-53"
                - text: In a deal announced the same day, OpenAI agreed to purchase $250 billion of Azure services, with Microsoft ceding their
                - link "right of first refusal" [ref=f11e696] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Right_of_first_refusal
                - text: over OpenAI's future cloud computing purchases.
                - superscript [ref=f11e697]:
                  - link "[52]" [ref=f11e698] [cursor=pointer]:
                    - /url: "#cite_note-cnbc-restructure-53"
                - superscript [ref=f11e700]:
                  - link "[64]" [ref=f11e701] [cursor=pointer]:
                    - /url: "#cite_note-verge-restructure-65"
                - text: As part of the deal, OpenAI will continue to share 20% of its revenue with Microsoft until it achieves AGI, which must now be verified by an independent panel of experts.
                - superscript [ref=f11e703]:
                  - link "[51]" [ref=f11e704] [cursor=pointer]:
                    - /url: "#cite_note-reuters-restructure-52"
                - superscript [ref=f11e706]:
                  - link "[64]" [ref=f11e707] [cursor=pointer]:
                    - /url: "#cite_note-verge-restructure-65"
                - text: The deal also loosened restrictions on both companies working with third parties, allowing Microsoft to pursue AGI independently and allowing OpenAI to develop products with other companies.
                - superscript [ref=f11e709]:
                  - link "[52]" [ref=f11e710] [cursor=pointer]:
                    - /url: "#cite_note-cnbc-restructure-53"
                - superscript [ref=f11e712]:
                  - link "[7]" [ref=f11e713] [cursor=pointer]:
                    - /url: "#cite_note-nyt-restructure-8"
                - superscript [ref=f11e715]:
                  - link "[64]" [ref=f11e716] [cursor=pointer]:
                    - /url: "#cite_note-verge-restructure-65"
              - paragraph [ref=f11e718]:
                - text: In April 2026, the two firms announced a new agreement which removed many of the more restrictive aspects of their partnership. No longer the exclusive cloud provider, Microsoft then had the first right to provide cloud services, but OpenAI could purchase other services in the event that Microsoft did not provide sufficient capacity. OpenAI will no longer receive a portion of Microsoft's revenue from using OpenAI's technology. The
                - link "artificial general intelligence" [ref=f11e719] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Artificial_general_intelligence
                - text: clause which created uncertainty for Microsoft in the event OpenAI determined that they had created AGI was dropped.
                - superscript [ref=f11e720]:
                  - link "[65]" [ref=f11e721] [cursor=pointer]:
                    - /url: "#cite_note-66"
            - region [ref=f11e723]:
              - generic [ref=f11e724]:
                - heading "Finances" [level=3] [ref=f11e725]
                - generic [ref=f11e726]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=7
              - paragraph [ref=f11e727]:
                - text: In 2017, OpenAI spent $7.9 million, a quarter of its functional expenses, on cloud computing alone.
                - superscript [ref=f11e728]:
                  - link "[66]" [ref=f11e729] [cursor=pointer]:
                    - /url: "#cite_note-67"
                - text: In comparison,
                - link "DeepMind" [ref=f11e731] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/DeepMind
                - text: "'s total expenses in 2017 were $442 million. In the summer of 2018, training OpenAI's Dota 2 bots required renting 128,000"
                - link "CPUs" [ref=f11e732] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Central_processing_unit
                - text: and 256
                - link "GPUs" [ref=f11e733] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Graphics_processing_unit
                - text: from Google for multiple weeks.
                - superscript [ref=f11e734]:
                  - link "[39]" [ref=f11e735] [cursor=pointer]:
                    - /url: "#cite_note-wired_investors-40"
                - text: Microsoft's 2019 investment in OpenAI, totaling $1 billion, reportedly kicked off the "contemporary AI boom".
                - superscript [ref=f11e737]:
                  - link "[67]" [ref=f11e738] [cursor=pointer]:
                    - /url: "#cite_note-68"
                - superscript [ref=f11e740]:
                  - link "[68]" [ref=f11e741] [cursor=pointer]:
                    - /url: "#cite_note-69"
              - paragraph [ref=f11e743]:
                - text: In October 2024, OpenAI completed a $6.6 billion capital raise with a $157 billion valuation including investments from Microsoft, Nvidia, and SoftBank.
                - superscript [ref=f11e744]:
                  - link "[69]" [ref=f11e745] [cursor=pointer]:
                    - /url: "#cite_note-70"
              - paragraph [ref=f11e747]:
                - text: On January 21, 2025,
                - link "Donald Trump" [ref=f11e748] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Donald_Trump
                - text: announced
                - link "The Stargate Project" [ref=f11e749] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stargate_LLC
                - text: ", a joint venture between OpenAI,"
                - link "Oracle" [ref=f11e750] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Oracle_Corporation
                - text: ","
                - link "SoftBank" [ref=f11e751] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SoftBank_Group
                - text: and
                - link "MGX" [ref=f11e752] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/MGX_(company)
                - text: to build an AI infrastructure system in conjunction with the
                - link "US government" [ref=f11e753] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Federal_government_of_the_United_States
                - text: . The project takes its name from OpenAI's existing "Stargate" supercomputer project and is estimated to cost $500 billion. The partners planned to fund the project over the next four years.
                - superscript [ref=f11e754]:
                  - link "[70]" [ref=f11e755] [cursor=pointer]:
                    - /url: "#cite_note-71"
                - text: In July, the
                - link "United States Department of Defense" [ref=f11e757] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_Department_of_Defense
                - text: announced that OpenAI had received a $200 million contract for AI in the military, along with Anthropic, Google, and
                - link "xAI" [ref=f11e758] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/XAI_(company)
                - text: .
                - superscript [ref=f11e759]:
                  - link "[71]" [ref=f11e760] [cursor=pointer]:
                    - /url: "#cite_note-72"
                - text: In the same month, the company made a deal with the
                - link "UK Government" [ref=f11e762] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/UK_Government
                - text: to use ChatGPT and other AI tools in public services.
                - superscript [ref=f11e763]:
                  - link "[72]" [ref=f11e764] [cursor=pointer]:
                    - /url: "#cite_note-73"
                - superscript [ref=f11e766]:
                  - link "[73]" [ref=f11e767] [cursor=pointer]:
                    - /url: "#cite_note-74"
                - text: OpenAI subsequently began a $50 million fund to support nonprofit and community organizations.
                - superscript [ref=f11e769]:
                  - link "[74]" [ref=f11e770] [cursor=pointer]:
                    - /url: "#cite_note-75"
              - paragraph [ref=f11e772]:
                - text: In April 2025, OpenAI raised $40 billion at a $300 billion post-money valuation, which was the highest-value private technology deal in history. The financing round was led by SoftBank, with other participants including Microsoft,
                - link "Coatue" [ref=f11e773] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coatue_Management
                - text: ","
                - link "Altimeter" [ref=f11e774] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Altimeter_Capital
                - text: and
                - link "Thrive" [ref=f11e775] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thrive_Capital
                - text: .
                - superscript [ref=f11e776]:
                  - link "[75]" [ref=f11e777] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - superscript [ref=f11e779]:
                  - link "[76]" [ref=f11e780] [cursor=pointer]:
                    - /url: "#cite_note-77"
              - paragraph [ref=f11e782]:
                - text: In July 2025, the company reported annualized revenue of $12 billion.
                - superscript [ref=f11e783]:
                  - link "[77]" [ref=f11e784] [cursor=pointer]:
                    - /url: "#cite_note-78"
                - superscript [ref=f11e786]:
                  - link "[78]" [ref=f11e787] [cursor=pointer]:
                    - /url: "#cite_note-79"
                - text: This was an increase from $3.7 billion in 2024, which was driven by ChatGPT subscriptions, which reached 20 million paid subscribers by April 2025, up from 15.5 million at the end of 2024, alongside a rapidly expanding enterprise customer base that grew to five million business users.
                - superscript [ref=f11e789]:
                  - link "[79]" [ref=f11e790] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - superscript [ref=f11e792]:
                  - link "[80]" [ref=f11e793] [cursor=pointer]:
                    - /url: "#cite_note-81"
                - superscript [ref=f11e795]:
                  - link "[81]" [ref=f11e796] [cursor=pointer]:
                    - /url: "#cite_note-82"
              - paragraph [ref=f11e798]:
                - text: In February 2026, OpenAI raised $110billion at a $730billion valuation, led by
                - link "Amazon" [ref=f11e801] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Amazon_(company)
                - text: ($50billion),
                - link "SoftBank" [ref=f11e803] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SoftBank
                - text: ($30billion), and
                - link "Nvidia" [ref=f11e805] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nvidia
                - text: ($30billion), surpassing the prior round as the largest private technology fundraise in history.
                - superscript [ref=f11e807]:
                  - link "[82]" [ref=f11e808] [cursor=pointer]:
                    - /url: "#cite_note-openai-110b-2026-83"
                - text: The round was later extended to $120billion in March 2026.
                - superscript [ref=f11e811]:
                  - link "[83]" [ref=f11e812] [cursor=pointer]:
                    - /url: "#cite_note-openai-120b-2026-84"
                - text: In April 2026, the company announced that it closed a funding round of $122 billion in committed capital at a post-money valuation of $852 billion.
                - superscript [ref=f11e814]:
                  - link "[84]" [ref=f11e815] [cursor=pointer]:
                    - /url: "#cite_note-85"
              - region [ref=f11e817]:
                - generic [ref=f11e818]:
                  - heading "Initial public offering (2026)" [level=4] [ref=f11e819]
                  - generic [ref=f11e820]:
                    - link "edit":
                      - /url: /w/index.php?title=OpenAI&action=edit&section=8
                - paragraph [ref=f11e821]:
                  - text: The for-profit structure established in 2025 allows the PBC to raise investor funds like most traditional tech companies, including through an
                  - link "initial public offering" [ref=f11e822] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Initial_public_offering
                  - text: (IPO), which Altman claimed was the most likely path forward.
                  - superscript [ref=f11e823]:
                    - link "[51]" [ref=f11e824] [cursor=pointer]:
                      - /url: "#cite_note-reuters-restructure-52"
                  - text: On June 8, 2026, OpenAI confirmed it filed for an IPO with the
                  - link "US Securities and Exchange" [ref=f11e826] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/US_Securities_and_Exchange
                  - text: .
                  - superscript [ref=f11e827]:
                    - link "[85]" [ref=f11e828] [cursor=pointer]:
                      - /url: "#cite_note-86"
                  - text: The company did not disclose the terms or timeline, and said "it could be a while [before any listing] because there are things we want to do that are likely easier as a private company."
                  - superscript [ref=f11e830]:
                    - link "[86]" [ref=f11e831] [cursor=pointer]:
                      - /url: "#cite_note-87"
                  - text: That week, Altman also told staff that he expected an IPO "within the next year" and that the faster the company develops
                  - link "recursive self-improvement" [ref=f11e833] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Recursive_self-improvement
                  - text: ", \"⁠the more it could be advantageous to delay an IPO\"."
                  - superscript [ref=f11e834]:
                    - link "[87]" [ref=f11e835] [cursor=pointer]:
                      - /url: "#cite_note-88"
          - region [ref=f11e837]:
            - generic [ref=f11e838]:
              - heading "Business model" [level=2] [ref=f11e839]
              - generic [ref=f11e840]:
                - link "edit":
                  - /url: /w/index.php?title=OpenAI&action=edit&section=9
            - paragraph [ref=f11e841]:
              - text: OpenAI uses a tiered revenue model that combines free consumer access, paid subscription services, enterprise licensing, and
              - link "application programming interface" [ref=f11e842] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Application_programming_interface
              - text: (API) usage-based pricing.
              - superscript [ref=f11e843]:
                - link "[88]" [ref=f11e844] [cursor=pointer]:
                  - /url: "#cite_note-Friar2026-89"
              - text: The basic functionality is provided at no cost, while advanced capabilities are offered through paid plans such as ChatGPT Plus and enterprise solutions. OpenAI's subscription and enterprise offerings are structured around scalable compute usage and API integration into third-party platforms.
              - superscript [ref=f11e846]:
                - link "[88]" [ref=f11e847] [cursor=pointer]:
                  - /url: "#cite_note-Friar2026-89"
              - text: In 2025, the company reported significant revenue growth associated with expanded computing infrastructure and enterprise adoption.
              - superscript [ref=f11e849]:
                - link "[89]" [ref=f11e850] [cursor=pointer]:
                  - /url: "#cite_note-ReutersRevenue2026-90"
            - paragraph [ref=f11e852]:
              - text: The company's
              - link "cash burn" [ref=f11e853] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Burn_rate
              - text: remains high because of the intensive computational costs required to train and operate large language models. It projects an $8 billion operating loss in 2025.
              - superscript [ref=f11e854]:
                - link "[90]" [ref=f11e855] [cursor=pointer]:
                  - /url: "#cite_note-91"
              - superscript [ref=f11e857]:
                - link "[91]" [ref=f11e858] [cursor=pointer]:
                  - /url: "#cite_note-92"
              - text: OpenAI reports revised long-term spending projections totaling approximately $115 billion through 2029,
              - superscript [ref=f11e860]:
                - link "[92]" [ref=f11e861] [cursor=pointer]:
                  - /url: "#cite_note-yahoo-93"
              - text: with annual expenditures projected to escalate significantly, reaching $17 billion in 2026, $35 billion in 2027, and $45 billion in 2028.
              - superscript [ref=f11e863]:
                - link "[93]" [ref=f11e864] [cursor=pointer]:
                  - /url: "#cite_note-ground_news-94"
              - superscript [ref=f11e866]:
                - link "[94]" [ref=f11e867] [cursor=pointer]:
                  - /url: "#cite_note-95"
              - text: These expenditures are primarily allocated toward expanding compute infrastructure, developing proprietary AI chips, constructing data centers, and funding intensive model training programs, with more than half of the spending through the end of the decade expected to support research-intensive compute for model training and development.
              - superscript [ref=f11e869]:
                - link "[95]" [ref=f11e870] [cursor=pointer]:
                  - /url: "#cite_note-96"
            - paragraph [ref=f11e872]:
              - text: The company's financial strategy prioritizes market expansion and technological advancement over near-term profitability, with OpenAI's 2025 forecast predicting cash-flow-positive operations by 2029 and projecting revenue of approximately $200 billion by 2030.
              - superscript [ref=f11e873]:
                - link "[93]" [ref=f11e874] [cursor=pointer]:
                  - /url: "#cite_note-ground_news-94"
            - paragraph [ref=f11e876]:
              - text: In October 2025, OpenAI completed an employee share sale of up to $10 billion to existing investors which valued the company at $500 billion. The deal valued OpenAI as the most valuable privately owned company in the world—surpassing
              - link "SpaceX" [ref=f11e877] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/SpaceX
              - text: as the world's most valuable private company.
              - superscript [ref=f11e878]:
                - link "[96]" [ref=f11e879] [cursor=pointer]:
                  - /url: "#cite_note-97"
              - superscript [ref=f11e881]:
                - link "[97]" [ref=f11e882] [cursor=pointer]:
                  - /url: "#cite_note-98"
            - paragraph [ref=f11e884]:
              - text: In April 2026, reports indicated that OpenAI projected approximately $2.5 billion in advertising revenue for the year, with estimates rising to $100 billion annually by 2030, highlighting advertising as a key component of its future business strategy.
              - superscript [ref=f11e885]:
                - link "[98]" [ref=f11e886] [cursor=pointer]:
                  - /url: "#cite_note-99"
            - paragraph [ref=f11e888]:
              - text: In June 2026, it was announced that OpenAI and the White House have been in ongoing talks for about a year to allow a possible government stake in the company.
              - superscript [ref=f11e889]:
                - link "[99]" [ref=f11e890] [cursor=pointer]:
                  - /url: "#cite_note-100"
            - region [ref=f11e892]:
              - generic [ref=f11e893]:
                - heading "Acquisitions" [level=3] [ref=f11e894]
                - generic [ref=f11e895]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=10
              - paragraph [ref=f11e896]:
                - text: In August 2023, it was announced that OpenAI had acquired the
                - link "New York" [ref=f11e897] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_York_City
                - text: "-based start-up Global Illumination, a company that deploys AI to develop digital infrastructure and creative tools."
                - superscript [ref=f11e898]:
                  - link "[100]" [ref=f11e899] [cursor=pointer]:
                    - /url: "#cite_note-101"
              - paragraph [ref=f11e901]:
                - text: In June 2024, OpenAI acquired Multi, a startup focused on remote collaboration.
                - superscript [ref=f11e902]:
                  - link "[101]" [ref=f11e903] [cursor=pointer]:
                    - /url: "#cite_note-102"
              - paragraph [ref=f11e905]:
                - text: On February 10, 2025, a consortium of investors led by Elon Musk submitted a $97.4 billion unsolicited bid to buy the nonprofit that controls OpenAI, declaring willingness to match or exceed any better offer.
                - superscript [ref=f11e906]:
                  - link "[102]" [ref=f11e907] [cursor=pointer]:
                    - /url: "#cite_note-103"
                - superscript [ref=f11e909]:
                  - link "[103]" [ref=f11e910] [cursor=pointer]:
                    - /url: "#cite_note-Toonkel-2025-104"
                - text: The offer was rejected on 14 February 2025, with OpenAI stating that it was not for sale,
                - superscript [ref=f11e912]:
                  - link "[104]" [ref=f11e913] [cursor=pointer]:
                    - /url: "#cite_note-105"
                - text: but the offer complicated Altman's restructuring plan by suggesting a lower bar for how much the nonprofit should be valued.
                - superscript [ref=f11e915]:
                  - link "[103]" [ref=f11e916] [cursor=pointer]:
                    - /url: "#cite_note-Toonkel-2025-104"
              - paragraph [ref=f11e918]:
                - text: In March 2025, OpenAI reached a deal with
                - link "CoreWeave" [ref=f11e919] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/CoreWeave
                - text: to acquire $350 million worth of CoreWeave shares and access to AI infrastructure, in return for $11.9 billion paid over five years. Microsoft was already CoreWeave's biggest customer in 2024.
                - superscript [ref=f11e920]:
                  - link "[105]" [ref=f11e921] [cursor=pointer]:
                    - /url: "#cite_note-ReuterCore-106"
                - text: Alongside their other business dealings, OpenAI and Microsoft were renegotiating the terms of their partnership to facilitate a potential future
                - link "IPO" [ref=f11e923] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Initial_public_offering
                - text: by OpenAI, while ensuring Microsoft's continued access to advanced AI models.
                - superscript [ref=f11e924]:
                  - link "[9]" [ref=f11e925] [cursor=pointer]:
                    - /url: "#cite_note-Reuters_2025-10"
                - text: On May 21, 2025 OpenAI announced the $6.5 billion acquisition of
                - link "io" [ref=f11e927] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Io_(company)
                - text: ", an AI hardware start-up founded by former Apple designer"
                - link "Jony Ive" [ref=f11e928] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jony_Ive
                - text: in 2024.
                - superscript [ref=f11e929]:
                  - link "[106]" [ref=f11e930] [cursor=pointer]:
                    - /url: "#cite_note-107"
                - superscript [ref=f11e932]:
                  - link "[107]" [ref=f11e933] [cursor=pointer]:
                    - /url: "#cite_note-108"
                - superscript [ref=f11e935]:
                  - link "[108]" [ref=f11e936] [cursor=pointer]:
                    - /url: "#cite_note-109"
              - paragraph [ref=f11e938]:
                - text: In September 2025, OpenAI agreed to acquire the product testing startup Statsig for $1.1 billion in an all-stock deal and appointed Statsig's founding CEO
                - link "Vijaye Raji" [ref=f11e939] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vijaye_Raji?action=edit&redlink=1
                - text: as OpenAI's chief technology officer of applications.
                - superscript [ref=f11e940]:
                  - link "[109]" [ref=f11e941] [cursor=pointer]:
                    - /url: "#cite_note-110"
                - text: The company also announced development of an AI-driven hiring service designed to rival
                - link "LinkedIn" [ref=f11e943] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/LinkedIn
                - text: .
                - superscript [ref=f11e944]:
                  - link "[110]" [ref=f11e945] [cursor=pointer]:
                    - /url: "#cite_note-Verge-111"
                - text: OpenAI acquired personal finance app Roi in October 2025.
                - superscript [ref=f11e947]:
                  - link "[111]" [ref=f11e948] [cursor=pointer]:
                    - /url: "#cite_note-112"
                - text: In October 2025, OpenAI acquired Software Applications Incorporated, the developer of Sky, a macOS-based natural language interface designed to operate across desktop applications. The Sky team joined OpenAI, and the company announced plans to integrate Sky's capabilities into ChatGPT.
                - superscript [ref=f11e950]:
                  - link "[112]" [ref=f11e951] [cursor=pointer]:
                    - /url: "#cite_note-113"
                - text: In December 2025, it was announced OpenAI had agreed to acquire Neptune, an AI tooling startup that helps companies track and manage model training, for an undisclosed amount.
                - superscript [ref=f11e953]:
                  - link "[113]" [ref=f11e954] [cursor=pointer]:
                    - /url: "#cite_note-114"
              - paragraph [ref=f11e956]:
                - text: In January 2026, it was announced OpenAI had acquired healthcare technology startup Torch for approximately $60 million. The acquisition followed the launch of OpenAI's ChatGPT Health product and was intended to strengthen the company's medical data and healthcare artificial intelligence capabilities.
                - superscript [ref=f11e957]:
                  - link "[114]" [ref=f11e958] [cursor=pointer]:
                    - /url: "#cite_note-115"
                - superscript [ref=f11e960]:
                  - link "[115]" [ref=f11e961] [cursor=pointer]:
                    - /url: "#cite_note-116"
                - text: OpenAI acquired
                - link "Python" [ref=f11e963] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Python_(programming_language)
                - text: tool developer Astral in March 2026.
                - superscript [ref=f11e964]:
                  - link "[116]" [ref=f11e965] [cursor=pointer]:
                    - /url: "#cite_note-117"
              - paragraph [ref=f11e967]:
                - text: In April 2026, the company acquired
                - link "TBPN" [ref=f11e968] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/TBPN
                - text: ", a media company in California, for an undisclosed sum."
                - superscript [ref=f11e969]:
                  - link "[117]" [ref=f11e970] [cursor=pointer]:
                    - /url: "#cite_note-118"
            - region [ref=f11e972]:
              - generic [ref=f11e973]:
                - heading "Corporate partnerships" [level=3] [ref=f11e974]
                - generic [ref=f11e975]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=11
              - note [ref=f11e976]:
                - text: For broader coverage of this topic, see
                - link "Content moderation and working conditions" [ref=f11e977] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Content_moderation_and_working_conditions
                - text: .
              - paragraph [ref=f11e978]:
                - text: OpenAI has been criticized for outsourcing the
                - link "annotation of data sets" [ref=f11e979] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Labeled_data
                - text: to
                - link "Sama" [ref=f11e980] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sama_(company)
                - text: ", a company based in San Francisco that employed workers in"
                - link "Kenya" [ref=f11e981] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kenya
                - text: . These annotations were used to train an AI model to detect toxicity, which could then be used to
                - link "moderate toxic content" [ref=f11e982] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Content_moderation
                - text: ", notably from ChatGPT's training data and outputs. However, these pieces of text usually contained detailed descriptions of various types of violence, including sexual violence. OpenAI began sending snippets of data to Sama as early as November 2021. The four Sama employees interviewed by"
                - link "Time" [ref=f11e984] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Time_(magazine)
                - text: described themselves as mentally scarred. OpenAI paid Sama $12.50 per hour of work, and Sama was redistributing the equivalent of between $1.32 and $2.00 per hour post-tax to its annotators. Sama's spokesperson said that the $12.50 was also covering other implicit costs, among which were infrastructure expenses, quality assurance and management.
                - superscript [ref=f11e985]:
                  - link "[118]" [ref=f11e986] [cursor=pointer]:
                    - /url: "#cite_note-Time1-119"
              - paragraph [ref=f11e988]:
                - text: In 2024, OpenAI began collaborating with
                - link "Broadcom" [ref=f11e989] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Broadcom
                - text: to design a custom AI chip capable of both training and inference, targeted for mass production in 2026 and to be manufactured by
                - link "TSMC" [ref=f11e990] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/TSMC
                - text: on a
                - link "3 nm process" [ref=f11e991] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/3_nm_process
                - text: node. This initiative intended to reduce OpenAI's dependence on Nvidia GPUs, which are costly and face high demand in the market.
                - superscript [ref=f11e992]:
                  - link "[119]" [ref=f11e993] [cursor=pointer]:
                    - /url: "#cite_note-120"
                - superscript [ref=f11e995]:
                  - link "[120]" [ref=f11e996] [cursor=pointer]:
                    - /url: "#cite_note-reuters-openai-broadcom-121"
                - superscript [ref=f11e998]:
                  - link "[121]" [ref=f11e999] [cursor=pointer]:
                    - /url: "#cite_note-ft-openai-broadcom-122"
              - paragraph [ref=f11e1001]:
                - text: In January 2024,
                - link "Arizona State University" [ref=f11e1002] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arizona_State_University
                - text: purchased ChatGPT Enterprise in OpenAI's first deal with a university.
                - superscript [ref=f11e1003]:
                  - link "[122]" [ref=f11e1004] [cursor=pointer]:
                    - /url: "#cite_note-123"
              - paragraph [ref=f11e1006]:
                - text: In June 2024,
                - link "Apple Inc." [ref=f11e1007] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Apple_Inc.
                - text: signed a contract with OpenAI to integrate ChatGPT features into its products as part of its new
                - link "Apple Intelligence" [ref=f11e1008] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Apple_Intelligence
                - text: initiative.
                - superscript [ref=f11e1009]:
                  - link "[123]" [ref=f11e1010] [cursor=pointer]:
                    - /url: "#cite_note-124"
                - superscript [ref=f11e1012]:
                  - link "[124]" [ref=f11e1013] [cursor=pointer]:
                    - /url: "#cite_note-125"
              - paragraph [ref=f11e1015]:
                - text: In December 2024, OpenAI partnered with
                - link "Anduril Industries" [ref=f11e1016] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anduril_Industries
                - text: to develop and deploy advanced artificial intelligence solutions for national security missions.
                - superscript [ref=f11e1017]:
                  - link "[125]" [ref=f11e1018] [cursor=pointer]:
                    - /url: "#cite_note-126"
              - paragraph [ref=f11e1020]:
                - text: In June 2025, OpenAI began renting
                - link "Google Cloud" [ref=f11e1021] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Cloud_Platform
                - text: "'s Tensor Processing Units ("
                - link "TPUs" [ref=f11e1022] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/TPU_(computing)
                - text: ) to support
                - link "ChatGPT" [ref=f11e1023] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ChatGPT
                - text: and related services, marking its first meaningful use of non‑Nvidia AI chips.
                - superscript [ref=f11e1024]:
                  - link "[126]" [ref=f11e1025] [cursor=pointer]:
                    - /url: "#cite_note-127"
              - paragraph [ref=f11e1027]:
                - text: In September 2025, it was revealed that OpenAI signed a contract with Oracle to purchase $300 billion in computing power over the next five years.
                - superscript [ref=f11e1028]:
                  - link "[127]" [ref=f11e1029] [cursor=pointer]:
                    - /url: "#cite_note-128"
              - paragraph [ref=f11e1031]:
                - text: In September 2025, OpenAI and Nvidia announced a memorandum of understanding that included a potential deployment of at least 10 gigawatts of Nvidia systems and a $100 billion investment from Nvidia in OpenAI. OpenAI expected the negotiations to be completed within weeks. As of January 2026, this has not been realized, and the two sides are rethinking the future of their partnership.
                - superscript [ref=f11e1032]:
                  - link "[128]" [ref=f11e1033] [cursor=pointer]:
                    - /url: "#cite_note-129"
                - superscript [ref=f11e1035]:
                  - link "[129]" [ref=f11e1036] [cursor=pointer]:
                    - /url: "#cite_note-130"
              - paragraph [ref=f11e1038]:
                - text: In October 2025, OpenAI announced a multi-billion dollar deal with
                - link "AMD" [ref=f11e1039] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/AMD
                - text: .
                - superscript [ref=f11e1040]:
                  - link "[130]" [ref=f11e1041] [cursor=pointer]:
                    - /url: "#cite_note-131"
                - text: OpenAI committed to purchasing six gigawatts worth of AMD chips, starting with the MI450. OpenAI will have the option to buy up to 160 million shares of AMD, about 10% of the company, depending on development, performance and share price targets.
                - superscript [ref=f11e1043]:
                  - link "[131]" [ref=f11e1044] [cursor=pointer]:
                    - /url: "#cite_note-132"
              - paragraph [ref=f11e1046]:
                - text: In December 2025,
                - link "Disney" [ref=f11e1047] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Walt_Disney_Company
                - text: said it would make a $1 billion investment in OpenAI, and signed a three-year licensing deal that will let users generate videos using Sora—OpenAI's short-form AI video platform. More than 200 Disney,
                - link "Marvel" [ref=f11e1048] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel_Studios
                - text: ","
                - link "Star Wars" [ref=f11e1049] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Star_Wars
                - text: and
                - link "Pixar" [ref=f11e1050] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pixar
                - text: characters would be available to OpenAI users.
                - superscript [ref=f11e1051]:
                  - link "[132]" [ref=f11e1052] [cursor=pointer]:
                    - /url: "#cite_note-133"
                - text: Disney would later exit this deal in late March 2026, due to Sora being discontinued.
                - superscript [ref=f11e1054]:
                  - link "[133]" [ref=f11e1055] [cursor=pointer]:
                    - /url: "#cite_note-:2-134"
                - superscript [ref=f11e1057]:
                  - link "[134]" [ref=f11e1058] [cursor=pointer]:
                    - /url: "#cite_note-135"
              - paragraph [ref=f11e1060]:
                - text: In early 2026,
                - link "Amazon" [ref=f11e1061] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Amazon_(company)
                - text: entered advanced discussions to invest up to $50 billion in OpenAI as part of a potential artificial intelligence partnership. Under the proposed agreement, OpenAI's models could be integrated into Amazon's digital assistant
                - link "Alexa" [ref=f11e1062] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Amazon_Alexa
                - text: and other internal projects.
                - superscript [ref=f11e1063]:
                  - link "[135]" [ref=f11e1064] [cursor=pointer]:
                    - /url: "#cite_note-136"
              - paragraph [ref=f11e1066]:
                - text: In June 2026, OpenAI announced partnerships with
                - link "Wix" [ref=f11e1067] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wix.com
                - text: ", Base44,"
                - link "Replit" [ref=f11e1068] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Replit
                - text: ","
                - link "Lovable" [ref=f11e1069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lovable_(company)
                - text: ","
                - link "Figma" [ref=f11e1070] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Figma
                - text: ", and Emergent to support its new Sites feature in Codex, which enables users to publish outputs as hosted, interactive websites rather than local files."
                - superscript [ref=f11e1071]:
                  - link "[136]" [ref=f11e1072] [cursor=pointer]:
                    - /url: "#cite_note-137"
              - paragraph [ref=f11e1074]:
                - text: On June 24, 2026, OpenAI announced its new chip called Jalapeño, created in collaboration with
                - link "Broadcom" [ref=f11e1075] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Broadcom
                - text: . The company plans to start rolling it out by the end of 2026.
                - superscript [ref=f11e1076]:
                  - link "[137]" [ref=f11e1077] [cursor=pointer]:
                    - /url: "#cite_note-138"
            - region [ref=f11e1079]:
              - generic [ref=f11e1080]:
                - heading "Government contracting" [level=3] [ref=f11e1081]
                - generic [ref=f11e1082]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=12
              - paragraph [ref=f11e1083]:
                - text: OpenAI provides
                - link "LLMs" [ref=f11e1084] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Large_language_model
                - text: to the
                - link "Artificial Intelligence Cyber Challenge" [ref=f11e1085] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/DARPA_Prize_Competitions
                - text: and to the
                - link "Advanced Research Projects Agency for Health" [ref=f11e1086] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Advanced_Research_Projects_Agency_for_Health
                - text: .
                - superscript [ref=f11e1087]:
                  - link "[138]" [ref=f11e1088] [cursor=pointer]:
                    - /url: "#cite_note-139"
                - text: In October 2024,
                - link "The Intercept" [ref=f11e1090] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Intercept
                - text: revealed that OpenAI's tools are considered "essential" for
                - link "AFRICOM" [ref=f11e1091] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_Africa_Command
                - text: "'s mission and included in an \"Exception to Fair Opportunity\" contractual agreement between the"
                - link "United States Department of Defense" [ref=f11e1092] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_Department_of_Defense
                - text: (DoD) and
                - link "Microsoft" [ref=f11e1093] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft
                - text: .
                - superscript [ref=f11e1094]:
                  - link "[139]" [ref=f11e1095] [cursor=pointer]:
                    - /url: "#cite_note-intercept-africom-140"
                - text: In December 2024, OpenAI said it would partner with defense-tech company
                - link "Anduril" [ref=f11e1097] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anduril_Industries
                - text: to build drone defense technologies for the United States and its allies.
                - superscript [ref=f11e1098]:
                  - link "[140]" [ref=f11e1099] [cursor=pointer]:
                    - /url: "#cite_note-141"
              - paragraph [ref=f11e1101]:
                - text: In 2025, OpenAI's Chief Product Officer, Kevin Weil, was commissioned
                - link "lieutenant colonel" [ref=f11e1102] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lieutenant_colonel
                - text: in the
                - link "U.S. Army" [ref=f11e1103] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_Army
                - text: to join
                - link "Detachment 201" [ref=f11e1104] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Detachment_201
                - text: as senior advisor.
                - superscript [ref=f11e1105]:
                  - link "[141]" [ref=f11e1106] [cursor=pointer]:
                    - /url: "#cite_note-142"
              - paragraph [ref=f11e1108]:
                - text: In June 2025, the DoD awarded OpenAI a $200 million one-year contract to develop AI tools for military and national security applications. OpenAI announced a new program, OpenAI for Government, to give federal, state, and local governments access to its models, including ChatGPT.
                - superscript [ref=f11e1109]:
                  - link "[142]" [ref=f11e1110] [cursor=pointer]:
                    - /url: "#cite_note-143"
                - superscript [ref=f11e1112]:
                  - link "[143]" [ref=f11e1113] [cursor=pointer]:
                    - /url: "#cite_note-144"
              - paragraph [ref=f11e1115]:
                - text: On 28 February 2026, after OpenAI's competitor
                - link "Anthropic" [ref=f11e1116] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthropic
                - text: refused to authorize the DoD to use its AI systems for
                - link "mass surveillance" [ref=f11e1117] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mass_surveillance
                - text: or
                - link "autonomous weapons systems" [ref=f11e1118] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Autonomous_weapons_systems
                - text: ", it was labeled a \"supply-chain risk\" by the DoD and the Trump administration decided to stop using it across the government."
                - superscript [ref=f11e1119]:
                  - link "[144]" [ref=f11e1120] [cursor=pointer]:
                    - /url: "#cite_note-145"
                - text: The same day, OpenAI announced that it had reached an agreement with the DoD to deploy its models in the government's classified network.
                - superscript [ref=f11e1122]:
                  - link "[145]" [ref=f11e1123] [cursor=pointer]:
                    - /url: "#cite_note-:1-146"
                - text: CEO Sam Altman wrote, "Two of our most important safety principles are prohibitions on domestic mass surveillance and human responsibility for the use of force, including for autonomous weapon systems", that the DoD agrees with this, and that this is included in their agreement.
                - superscript [ref=f11e1125]:
                  - link "[145]" [ref=f11e1126] [cursor=pointer]:
                    - /url: "#cite_note-:1-146"
                - superscript [ref=f11e1128]:
                  - link "[146]" [ref=f11e1129] [cursor=pointer]:
                    - /url: "#cite_note-147"
                - text: However, while the agreement mentioned existing law and allowed OpenAI to implement some technical safeguards, it did not incorporate legally binding prohibitions on domestic mass surveillance or fully autonomous weapons.
                - superscript [ref=f11e1131]:
                  - link "[147]" [ref=f11e1132] [cursor=pointer]:
                    - /url: "#cite_note-148"
                - superscript [ref=f11e1134]:
                  - link "[148]" [ref=f11e1135] [cursor=pointer]:
                    - /url: "#cite_note-149"
                - text: Following backlash over the potential use of ChatGPT for surveillance, Altman amended the contract to include more safeguards, though only excerpts of the contract were made public and critics remained concerned that it was purposefully vague and contained carve-outs for domestic surveillance.
                - superscript [ref=f11e1137]:
                  - link "[149]" [ref=f11e1138] [cursor=pointer]:
                    - /url: "#cite_note-150"
                - superscript [ref=f11e1140]:
                  - link "[150]" [ref=f11e1141] [cursor=pointer]:
                    - /url: "#cite_note-151"
          - region [ref=f11e1143]:
            - generic [ref=f11e1144]:
              - heading "Services" [level=2] [ref=f11e1145]
              - generic [ref=f11e1146]:
                - link "edit":
                  - /url: /w/index.php?title=OpenAI&action=edit&section=13
            - note [ref=f11e1147]:
              - text: "Main article:"
              - link "Products and applications of OpenAI" [ref=f11e1148] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Products_and_applications_of_OpenAI
            - region [ref=f11e1149]:
              - generic [ref=f11e1150]:
                - heading "Products" [level=3] [ref=f11e1151]
                - generic [ref=f11e1152]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=14
              - list [ref=f11e1153]:
                - listitem [ref=f11e1154]:
                  - link "ChatGPT" [ref=f11e1155] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/ChatGPT
                  - list [ref=f11e1156]:
                    - listitem [ref=f11e1157]:
                      - link "ChatGPT Deep Research" [ref=f11e1158] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/ChatGPT_Deep_Research
                    - listitem [ref=f11e1159]:
                      - link "ChatGPT Search" [ref=f11e1160] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/ChatGPT_Search
                    - listitem [ref=f11e1161]:
                      - link "ChatGPT Atlas" [ref=f11e1162] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/ChatGPT_Atlas
                - listitem [ref=f11e1163]:
                  - link "OpenAI Codex" [ref=f11e1164] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/OpenAI_Codex_(AI_agent)
                - listitem [ref=f11e1165]:
                  - link "Sora (text-to-video model)" [ref=f11e1166] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Sora_(text-to-video_model)
                - listitem [ref=f11e1167]:
                  - link "Whisper (speech recognition system)" [ref=f11e1168] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Whisper_(speech_recognition_system)
                - listitem [ref=f11e1169]:
                  - text: An
                  - link "API" [ref=f11e1170] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/API
                  - text: that gives access to various OpenAI models
            - region [ref=f11e1171]:
              - generic [ref=f11e1172]:
                - heading "Development" [level=3] [ref=f11e1173]
                - generic [ref=f11e1174]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=15
              - paragraph [ref=f11e1175]:
                - text: In February 2019,
                - link "GPT-2" [ref=f11e1176] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPT-2
                - text: was announced, which gained attention for its ability to generate human-like text.
                - superscript [ref=f11e1177]:
                  - link "[151]" [ref=f11e1178] [cursor=pointer]:
                    - /url: "#cite_note-guardian-152"
              - paragraph [ref=f11e1180]:
                - text: In 2020, OpenAI announced
                - link "GPT-3" [ref=f11e1181] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPT-3
                - text: ", a language model trained on large internet datasets. GPT-3 is aimed at natural language answering questions, but it can also translate between languages and coherently generate improvised text. It also announced that an associated API, named the API, would form the heart of its first commercial product."
                - superscript [ref=f11e1182]:
                  - link "[152]" [ref=f11e1183] [cursor=pointer]:
                    - /url: "#cite_note-2020-06-11_Bloomberg-153"
              - paragraph [ref=f11e1185]:
                - text: Eleven employees left OpenAI, mostly between December 2020 and January 2021, in order to establish
                - link "Anthropic" [ref=f11e1186] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthropic
                - text: .
                - superscript [ref=f11e1187]:
                  - link "[153]" [ref=f11e1188] [cursor=pointer]:
                    - /url: "#cite_note-154"
              - paragraph [ref=f11e1190]:
                - text: In 2021, OpenAI introduced
                - link "DALL-E" [ref=f11e1191] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/DALL-E
                - text: ", a specialized deep learning model adept at generating complex digital images from textual descriptions, utilizing a variant of the GPT-3 architecture."
                - superscript [ref=f11e1192]:
                  - link "[154]" [ref=f11e1193] [cursor=pointer]:
                    - /url: "#cite_note-155"
              - figure [ref=f11e1195]:
                - link [ref=f11e1196] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:UK_national_football_team_considering_compete_in_UEFA_Euro_and_FIFA_World_Cup_–_ChatGPT.jpg
                - generic [ref=f11e1198]:
                  - text: The release of
                  - link "ChatGPT" [ref=f11e1199] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/ChatGPT
                  - text: was a major event in the
                  - link "AI boom" [ref=f11e1200] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/AI_boom
                  - text: . By January 2023, ChatGPT had become what was then the fastest-growing consumer software application in history, gaining over 100 million users in two months.
                  - superscript [ref=f11e1201]:
                    - link "[155]" [ref=f11e1202] [cursor=pointer]:
                      - /url: "#cite_note-156"
              - paragraph [ref=f11e1204]:
                - text: In December 2022, OpenAI received widespread media coverage after launching a free preview of
                - link "ChatGPT" [ref=f11e1205] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ChatGPT
                - text: ", its new AI"
                - link "chatbot" [ref=f11e1206] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chatbot
                - text: based on GPT-3.5. According to OpenAI, the preview received over a million signups within the first five days.
                - superscript [ref=f11e1207]:
                  - link "[156]" [ref=f11e1208] [cursor=pointer]:
                    - /url: "#cite_note-157"
                - text: According to anonymous sources cited by
                - link "Reuters" [ref=f11e1210] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Reuters
                - text: in December 2022, OpenAI Global, LLC was projecting $200 million of revenue in 2023 and $1 billion in revenue in 2024.
                - superscript [ref=f11e1211]:
                  - link "[157]" [ref=f11e1212] [cursor=pointer]:
                    - /url: "#cite_note-158"
              - paragraph [ref=f11e1214]:
                - text: After ChatGPT was launched, Google announced a similar chatbot,
                - link "Bard" [ref=f11e1215] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bard_(chatbot)
                - text: ", amid internal concerns that ChatGPT could threaten Google's position as a primary source of online information."
                - superscript [ref=f11e1216]:
                  - link "[158]" [ref=f11e1217] [cursor=pointer]:
                    - /url: "#cite_note-159"
                - superscript [ref=f11e1219]:
                  - link "[159]" [ref=f11e1220] [cursor=pointer]:
                    - /url: "#cite_note-160"
              - paragraph [ref=f11e1222]:
                - text: On February 7, 2023, Microsoft announced that it was building AI technology based on the same foundation as ChatGPT into
                - link "Microsoft Bing" [ref=f11e1223] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Bing
                - text: ","
                - link "Edge" [ref=f11e1224] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Edge
                - text: ","
                - link "Microsoft 365" [ref=f11e1225] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_365
                - text: and other products.
                - superscript [ref=f11e1226]:
                  - link "[160]" [ref=f11e1227] [cursor=pointer]:
                    - /url: "#cite_note-161"
              - paragraph [ref=f11e1229]:
                - text: On March 14, 2023, OpenAI released
                - link "GPT-4" [ref=f11e1230] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPT-4
                - text: ", both as an API (with a waitlist) and as a feature of ChatGPT Plus."
                - superscript [ref=f11e1231]:
                  - link "[161]" [ref=f11e1232] [cursor=pointer]:
                    - /url: "#cite_note-162"
              - paragraph [ref=f11e1234]:
                - text: On November 6, 2023, OpenAI launched GPTs, allowing individuals to create customized versions of ChatGPT for specific purposes, further expanding the possibilities of AI applications across various industries.
                - superscript [ref=f11e1235]:
                  - link "[162]" [ref=f11e1236] [cursor=pointer]:
                    - /url: "#cite_note-163"
                - text: On November 14, 2023, OpenAI announced they temporarily suspended new sign-ups for ChatGPT Plus due to high demand.
                - superscript [ref=f11e1238]:
                  - link "[163]" [ref=f11e1239] [cursor=pointer]:
                    - /url: "#cite_note-164"
                - text: Access for newer subscribers re-opened a month later on December 13.
                - superscript [ref=f11e1241]:
                  - link "[164]" [ref=f11e1242] [cursor=pointer]:
                    - /url: "#cite_note-165"
              - paragraph [ref=f11e1244]:
                - text: In December 2024, the company launched the
                - link "Sora" [ref=f11e1245] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sora_(text-to-video_model)
                - text: model.
                - superscript [ref=f11e1246]:
                  - link "[165]" [ref=f11e1247] [cursor=pointer]:
                    - /url: "#cite_note-166"
                - superscript [ref=f11e1249]:
                  - link "[166]" [ref=f11e1250] [cursor=pointer]:
                    - /url: "#cite_note-167"
                - text: It also launched
                - link "OpenAI o1" [ref=f11e1252] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/OpenAI_o1
                - text: ", an early"
                - link "reasoning model" [ref=f11e1253] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Reasoning_model
                - text: that was internally codenamed strawberry.
                - superscript [ref=f11e1254]:
                  - link "[167]" [ref=f11e1255] [cursor=pointer]:
                    - /url: "#cite_note-168"
                - text: Additionally, ChatGPT Pro—a $200/month subscription service offering unlimited o1 access and enhanced voice features—was introduced, and preliminary benchmark results for the upcoming
                - link "OpenAI o3" [ref=f11e1257] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/OpenAI_o3
                - text: models were shared.
                - superscript [ref=f11e1258]:
                  - link "[168]" [ref=f11e1259] [cursor=pointer]:
                    - /url: "#cite_note-169"
              - paragraph [ref=f11e1261]:
                - text: On January 23, 2025, OpenAI released Operator, an
                - link "AI agent" [ref=f11e1262] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/AI_agent
                - text: and tool for accessing websites to execute goals defined by users. The feature was only available to Pro users in the United States.
                - superscript [ref=f11e1263]:
                  - link "[169]" [ref=f11e1264] [cursor=pointer]:
                    - /url: "#cite_note-170"
                - superscript [ref=f11e1266]:
                  - link "[170]" [ref=f11e1267] [cursor=pointer]:
                    - /url: "#cite_note-171"
                - text: OpenAI released
                - link "deep research agent" [ref=f11e1269] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ChatGPT_Deep_Research
                - text: ", nine days later. It scored a 27% accuracy on the benchmark"
                - link "Humanity's Last Exam" [ref=f11e1270] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Humanity's_Last_Exam
                - text: (HLE).
                - superscript [ref=f11e1271]:
                  - link "[171]" [ref=f11e1272] [cursor=pointer]:
                    - /url: "#cite_note-Verge_20250203-172"
                - text: Altman later stated GPT-4.5 would be the last model without full chain-of-thought reasoning.
                - superscript [ref=f11e1274]:
                  - link "[172]" [ref=f11e1275] [cursor=pointer]:
                    - /url: "#cite_note-giz2-173"
                - superscript [ref=f11e1277]:
                  - link "[173]" [ref=f11e1278] [cursor=pointer]:
                    - /url: "#cite_note-fort3-174"
              - paragraph [ref=f11e1280]:
                - text: In July 2025, according to OpenAI, one of its experimental models performed at a gold medal-level at the
                - link "International Mathematical Olympiad" [ref=f11e1281] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Mathematical_Olympiad
                - text: .
                - superscript [ref=f11e1282]:
                  - link "[174]" [ref=f11e1283] [cursor=pointer]:
                    - /url: "#cite_note-nature-maths-175"
                - superscript [ref=f11e1285]:
                  - link "[175]" [ref=f11e1286] [cursor=pointer]:
                    - /url: "#cite_note-176"
              - paragraph [ref=f11e1288]:
                - text: On October 6, 2025, OpenAI displayed its Agent Builder platform during the company's DevDay event. The platform includes a visual drag-and-drop interface for agentic workflows.
                - superscript [ref=f11e1289]:
                  - link "[176]" [ref=f11e1290] [cursor=pointer]:
                    - /url: "#cite_note-177"
              - paragraph [ref=f11e1292]:
                - text: On October 21, 2025, OpenAI introduced
                - link "ChatGPT Atlas" [ref=f11e1293] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ChatGPT_Atlas
                - text: ", a"
                - link "web browser" [ref=f11e1294] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_browser
                - text: which integrates ChatGPT into web navigation.
                - superscript [ref=f11e1295]:
                  - link "[177]" [ref=f11e1296] [cursor=pointer]:
                    - /url: "#cite_note-178"
                - superscript [ref=f11e1298]:
                  - link "[178]" [ref=f11e1299] [cursor=pointer]:
                    - /url: "#cite_note-179"
                - superscript [ref=f11e1301]:
                  - link "[179]" [ref=f11e1302] [cursor=pointer]:
                    - /url: "#cite_note-180"
              - paragraph [ref=f11e1304]:
                - text: On December 11, 2025, OpenAI announced
                - link "GPT-5.2" [ref=f11e1305] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPT-5.2
                - text: .
                - superscript [ref=f11e1306]:
                  - link "[180]" [ref=f11e1307] [cursor=pointer]:
                    - /url: "#cite_note-181"
              - paragraph [ref=f11e1309]:
                - text: In early 2026, reports indicated that OpenAI was working on a
                - link "collaborative software development platform" [ref=f11e1310] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Comparison_of_source-code-hosting_facilities
                - text: designed to compete with services such as
                - link "GitHub" [ref=f11e1311] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GitHub
                - text: and
                - link "GitLab" [ref=f11e1312] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GitLab
                - text: .
                - superscript [ref=f11e1313]:
                  - link "[181]" [ref=f11e1314] [cursor=pointer]:
                    - /url: "#cite_note-182"
              - paragraph [ref=f11e1316]:
                - text: On March 24, 2026, OpenAI announced that they would discontinue the
                - link "Sora" [ref=f11e1317] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sora_(text-to-video_model)
                - text: app, as well as developer access to the API for the Sora model.
                - superscript [ref=f11e1318]:
                  - link "[133]" [ref=f11e1319] [cursor=pointer]:
                    - /url: "#cite_note-:2-134"
                - superscript [ref=f11e1321]:
                  - link "[182]" [ref=f11e1322] [cursor=pointer]:
                    - /url: "#cite_note-183"
            - region [ref=f11e1324]:
              - generic [ref=f11e1325]:
                - heading "Transparency" [level=3] [ref=f11e1326]
                - generic [ref=f11e1327]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=16
              - paragraph [ref=f11e1328]:
                - text: In March 2023, the company was criticized for disclosing particularly few technical details about products like GPT-4, contradicting its initial commitment to openness and making it harder for independent researchers to replicate its work and develop safeguards. OpenAI cited competitiveness and safety concerns to justify this repudiation. OpenAI's former chief scientist Ilya Sutskever argued in 2023 that open-sourcing increasingly capable models was increasingly risky, and that the safety reasons for not open-sourcing the most potent AI models would become "obvious" in a few years.
                - superscript [ref=f11e1329]:
                  - link "[183]" [ref=f11e1330] [cursor=pointer]:
                    - /url: "#cite_note-184"
              - paragraph [ref=f11e1332]:
                - text: In September 2025, OpenAI published a study on how people use ChatGPT for everyday tasks.
                - superscript [ref=f11e1333]:
                  - link "[184]" [ref=f11e1334] [cursor=pointer]:
                    - /url: "#cite_note-185"
                - superscript [ref=f11e1336]:
                  - link "[185]" [ref=f11e1337] [cursor=pointer]:
                    - /url: "#cite_note-186"
                - text: The study found that "non-work tasks" (according to an LLM-based classifier) account for more than 72 percent of all ChatGPT usage, with a minority of overall usage related to business productivity.
                - superscript [ref=f11e1339]:
                  - link "[186]" [ref=f11e1340] [cursor=pointer]:
                    - /url: "#cite_note-187"
            - region [ref=f11e1342]:
              - generic [ref=f11e1343]:
                - heading "Alignment" [level=3] [ref=f11e1344]
                - generic [ref=f11e1345]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=17
              - paragraph [ref=f11e1346]:
                - text: In July 2023, OpenAI launched the superalignment project, aiming within four years to determine how to
                - link "align" [ref=f11e1347] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/AI_alignment
                - text: future superintelligent systems.
                - superscript [ref=f11e1348]:
                  - link "[187]" [ref=f11e1349] [cursor=pointer]:
                    - /url: "#cite_note-188"
                - text: OpenAI promised to dedicate 20% of its computing resources to the project, although the company's employees later reported that the company only allocated 1–2% of its resources to it.
                - superscript [ref=f11e1351]:
                  - link "[53]" [ref=f11e1352] [cursor=pointer]:
                    - /url: "#cite_note-Farrow-2026-54"
                - superscript [ref=f11e1354]:
                  - link "[188]" [ref=f11e1355] [cursor=pointer]:
                    - /url: "#cite_note-189"
                - text: OpenAI ended the project in May 2024 after its co-leaders
                - link "Ilya Sutskever" [ref=f11e1357] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ilya_Sutskever
                - text: and
                - link "Jan Leike" [ref=f11e1358] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jan_Leike
                - text: left the company.
                - superscript [ref=f11e1359]:
                  - link "[189]" [ref=f11e1360] [cursor=pointer]:
                    - /url: "#cite_note-190"
            - region [ref=f11e1362]:
              - generic [ref=f11e1363]:
                - heading "Leaked conversations" [level=3] [ref=f11e1364]
                - generic [ref=f11e1365]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=18
              - paragraph [ref=f11e1366]:
                - text: In August 2025, OpenAI was criticized after thousands of private ChatGPT conversations were inadvertently exposed to public search engines like Google due to an experimental "share with search engines" feature. The opt-in toggle, intended to allow users to make specific chats discoverable, resulted in some discussions including personal details such as names, locations, and intimate topics appearing in search results when users accidentally enabled it while sharing links. OpenAI announced the feature's permanent removal on August 1, 2025, and the company began coordinating with search providers to remove the exposed content, emphasizing that it was not a security breach but a design flaw that heightened privacy risks. CEO Sam Altman acknowledged the issue in a podcast, noting users often treat ChatGPT as a confidant for deeply personal matters, which amplified concerns about AI handling sensitive data.
                - superscript [ref=f11e1367]:
                  - link "[190]" [ref=f11e1368] [cursor=pointer]:
                    - /url: "#cite_note-191"
                - superscript [ref=f11e1370]:
