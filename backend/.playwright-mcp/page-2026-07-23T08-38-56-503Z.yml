                      - /url: "#cite_note-mercury-back-206"
            - region [ref=f11e1510]:
              - generic [ref=f11e1511]:
                - heading "Firing of Altman" [level=3] [ref=f11e1512]
                - generic [ref=f11e1513]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=23
              - note [ref=f11e1514]:
                - text: "Further information:"
                - link "Removal of Sam Altman from OpenAI" [ref=f11e1515] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Removal_of_Sam_Altman_from_OpenAI
              - figure "Sam Altman in 2019" [ref=f11e1516]:
                - link [ref=f11e1517] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Sam_Altman_TechCrunch_SF_2019_Day_2_Oct_3_(cropped)_(cropped).jpg
              - paragraph [ref=f11e1520]:
                - text: On November 17, 2023, Sam Altman was removed as CEO when OpenAI's board of directors (composed of
                - link "Helen Toner" [ref=f11e1521] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Helen_Toner
                - text: ","
                - link "Ilya Sutskever" [ref=f11e1522] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ilya_Sutskever
                - text: ","
                - link "Adam D'Angelo" [ref=f11e1523] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adam_D'Angelo
                - text: and Tasha McCauley) cited a
                - link "lack of confidence" [ref=f11e1524] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Motion_of_no_confidence
                - text: in him. Chief Technology Officer
                - link "Mira Murati" [ref=f11e1525] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mira_Murati
                - text: took over as interim CEO.
                - link "Greg Brockman" [ref=f11e1526] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greg_Brockman
                - text: ", the president of OpenAI, was also removed as chairman of the board"
                - superscript [ref=f11e1527]:
                  - link "[206]" [ref=f11e1528] [cursor=pointer]:
                    - /url: "#cite_note-207"
                - superscript [ref=f11e1530]:
                  - link "[207]" [ref=f11e1531] [cursor=pointer]:
                    - /url: "#cite_note-guard-17nov2023-208"
                - text: and resigned from the company's presidency shortly thereafter.
                - superscript [ref=f11e1533]:
                  - link "[208]" [ref=f11e1534] [cursor=pointer]:
                    - /url: "#cite_note-209"
                - text: "Three senior OpenAI researchers subsequently resigned: director of research and GPT-4 lead Jakub Pachocki, head of AI risk Aleksander Mądry, and researcher Szymon Sidor."
                - superscript [ref=f11e1536]:
                  - link "[209]" [ref=f11e1537] [cursor=pointer]:
                    - /url: "#cite_note-210"
                - superscript [ref=f11e1539]:
                  - link "[210]" [ref=f11e1540] [cursor=pointer]:
                    - /url: "#cite_note-211"
              - paragraph [ref=f11e1542]:
                - text: On November 18, 2023, there were reportedly talks of Altman returning as CEO amid pressure placed upon the board by investors such as Microsoft and
                - link "Thrive Capital" [ref=f11e1543] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thrive_Capital
                - text: ", who objected to Altman's departure."
                - superscript [ref=f11e1544]:
                  - link "[211]" [ref=f11e1545] [cursor=pointer]:
                    - /url: "#cite_note-212"
                - text: Although Altman himself spoke in favor of returning to OpenAI, he has since stated that he considered starting a new company and bringing former OpenAI employees with him if talks to reinstate him did not work out.
                - superscript [ref=f11e1547]:
                  - link "[212]" [ref=f11e1548] [cursor=pointer]:
                    - /url: "#cite_note-213"
                - text: Altman insisted multiple times that all board members who supported his removal should resign;
                - superscript [ref=f11e1550]:
                  - link "[53]" [ref=f11e1551] [cursor=pointer]:
                    - /url: "#cite_note-Farrow-2026-54"
                - text: the board members agreed "in principle" to resign if Altman returned.
                - superscript [ref=f11e1553]:
                  - link "[213]" [ref=f11e1554] [cursor=pointer]:
                    - /url: "#cite_note-214"
                - text: On November 19, 2023, negotiations with Altman to return failed and Murati was replaced by
                - link "Emmett Shear" [ref=f11e1556] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Emmett_Shear
                - text: as interim CEO.
                - superscript [ref=f11e1557]:
                  - link "[214]" [ref=f11e1558] [cursor=pointer]:
                    - /url: "#cite_note-215"
                - text: The board initially contacted
                - link "Anthropic" [ref=f11e1560] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthropic
                - text: CEO
                - link "Dario Amodei" [ref=f11e1561] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dario_Amodei
                - text: (a former OpenAI executive) about replacing Altman, and proposed a
                - link "merger" [ref=f11e1562] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mergers_and_acquisitions
                - text: of the two companies, but both offers were declined.
                - superscript [ref=f11e1563]:
                  - link "[215]" [ref=f11e1564] [cursor=pointer]:
                    - /url: "#cite_note-216"
              - paragraph [ref=f11e1566]:
                - text: On November 20, 2023, Microsoft CEO
                - link "Satya Nadella" [ref=f11e1567] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Satya_Nadella
                - text: announced Altman and Brockman would be joining Microsoft to lead a new advanced AI research team, but added that they were still committed to OpenAI despite recent events.
                - superscript [ref=f11e1568]:
                  - link "[216]" [ref=f11e1569] [cursor=pointer]:
                    - /url: "#cite_note-217"
                - text: Before the partnership with Microsoft was finalized, Altman gave the board another opportunity to negotiate with him.
                - superscript [ref=f11e1571]:
                  - link "[217]" [ref=f11e1572] [cursor=pointer]:
                    - /url: "#cite_note-218"
                - text: About 738 of OpenAI's 770 employees, including Murati and Sutskever, signed an open letter stating they would quit their jobs and join Microsoft if the board did not rehire Altman and then resign.
                - superscript [ref=f11e1574]:
                  - link "[218]" [ref=f11e1575] [cursor=pointer]:
                    - /url: "#cite_note-219"
                - superscript [ref=f11e1577]:
                  - link "[219]" [ref=f11e1578] [cursor=pointer]:
                    - /url: "#cite_note-220"
                - text: This prompted OpenAI investors to consider legal action against the board as well.
                - superscript [ref=f11e1580]:
                  - link "[220]" [ref=f11e1581] [cursor=pointer]:
                    - /url: "#cite_note-221"
                - text: In response, OpenAI management sent an internal memo to employees stating that negotiations with Altman and the board had resumed and would take some time.
                - superscript [ref=f11e1583]:
                  - link "[221]" [ref=f11e1584] [cursor=pointer]:
                    - /url: "#cite_note-222"
              - paragraph [ref=f11e1586]:
                - text: On November 21, 2023, after continued negotiations, Altman and Brockman returned to the company in their prior roles along with a reconstructed board made up of new members
                - link "Bret Taylor" [ref=f11e1587] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bret_Taylor
                - text: (as chairman) and
                - link "Lawrence Summers" [ref=f11e1588] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lawrence_Summers
                - text: ", with D'Angelo remaining."
                - superscript [ref=f11e1589]:
                  - link "[222]" [ref=f11e1590] [cursor=pointer]:
                    - /url: "#cite_note-223"
                - superscript [ref=f11e1592]:
                  - link "[223]" [ref=f11e1593] [cursor=pointer]:
                    - /url: "#cite_note-224"
                - text: According to subsequent reporting, shortly before Altman's firing, some employees raised concerns to the board about how he had handled the safety implications of a recent internal AI capability discovery.
                - superscript [ref=f11e1595]:
                  - link "[224]" [ref=f11e1596] [cursor=pointer]:
                    - /url: "#cite_note-Anna_Tong_2023_u135-225"
                - text: On November 29, 2023, OpenAI announced that an anonymous Microsoft employee had joined the board as a non-voting member to observe the company's operations;
                - superscript [ref=f11e1598]:
                  - link "[225]" [ref=f11e1599] [cursor=pointer]:
                    - /url: "#cite_note-226"
                - text: Microsoft resigned from the board in July 2024.
                - superscript [ref=f11e1601]:
                  - link "[226]" [ref=f11e1602] [cursor=pointer]:
                    - /url: "#cite_note-227"
              - paragraph [ref=f11e1604]:
                - text: In February 2024, the
                - link "Securities and Exchange Commission" [ref=f11e1605] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Securities_and_Exchange_Commission
                - text: subpoenaed OpenAI's internal communication to determine if Altman's alleged lack of candor misled investors.
                - superscript [ref=f11e1606]:
                  - link "[227]" [ref=f11e1607] [cursor=pointer]:
                    - /url: "#cite_note-228"
                - text: Following the temporary removal of Sam Altman and his return, many employees gradually left OpenAI, including most of the original leadership team and a significant number of AI safety researchers.
                - superscript [ref=f11e1609]:
                  - link "[228]" [ref=f11e1610] [cursor=pointer]:
                    - /url: "#cite_note-229"
                - superscript [ref=f11e1612]:
                  - link "[229]" [ref=f11e1613] [cursor=pointer]:
                    - /url: "#cite_note-230"
            - region [ref=f11e1615]:
              - generic [ref=f11e1616]:
                - heading "Personnel changes" [level=3] [ref=f11e1617]
                - generic [ref=f11e1618]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=24
              - paragraph [ref=f11e1619]:
                - text: In 2018, Musk resigned from his Board of Directors seat, citing "a potential future
                - link "conflict [of interest]" [ref=f11e1620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Conflict_of_interest
                - text: "\" with his role as CEO of"
                - link "Tesla" [ref=f11e1621] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tesla,_Inc.
                - text: due to Tesla's
                - link "AI development for self-driving cars" [ref=f11e1622] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tesla_Autopilot
                - text: .
                - superscript [ref=f11e1623]:
                  - link "[230]" [ref=f11e1624] [cursor=pointer]:
                    - /url: "#cite_note-musk_resigns-231"
                - text: OpenAI stated that Musk's financial contributions were below $45 million.
                - superscript [ref=f11e1626]:
                  - link "[231]" [ref=f11e1627] [cursor=pointer]:
                    - /url: "#cite_note-232"
              - paragraph [ref=f11e1629]:
                - text: On March 3, 2023,
                - link "Reid Hoffman" [ref=f11e1630] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Reid_Hoffman
                - text: resigned from his board seat, citing a desire to avoid conflicts of interest with his investments in AI companies via
                - link "Greylock Partners" [ref=f11e1631] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greylock_Partners
                - text: ", and his co-founding of the AI startup"
                - link "Inflection AI" [ref=f11e1632] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Inflection_AI
                - text: . Hoffman remained on the board of Microsoft, a major investor in OpenAI.
                - superscript [ref=f11e1633]:
                  - link "[232]" [ref=f11e1634] [cursor=pointer]:
                    - /url: "#cite_note-233"
              - paragraph [ref=f11e1636]:
                - text: In May 2024, Chief Scientist
                - link "Ilya Sutskever" [ref=f11e1637] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ilya_Sutskever
                - text: resigned and was succeeded by
                - link "Jakub Pachocki" [ref=f11e1638] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jakub_Pachocki
                - text: . Co-leader
                - link "Jan Leike" [ref=f11e1639] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jan_Leike
                - text: also departed amid concerns over safety and trust.
                - superscript [ref=f11e1640]:
                  - link "[194]" [ref=f11e1641] [cursor=pointer]:
                    - /url: "#cite_note-may14-195"
                - superscript [ref=f11e1643]:
                  - link "[233]" [ref=f11e1644] [cursor=pointer]:
                    - /url: "#cite_note-234"
                - text: OpenAI then signed deals with
                - link "Reddit" [ref=f11e1646] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Reddit
                - text: ","
                - link "News Corp" [ref=f11e1647] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/News_Corp
                - text: ","
                - link "Axios" [ref=f11e1648] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Axios_(website)
                - text: ", and"
                - link "Vox Media" [ref=f11e1649] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vox_Media
                - text: .
                - superscript [ref=f11e1650]:
                  - link "[234]" [ref=f11e1651] [cursor=pointer]:
                    - /url: "#cite_note-235"
                - superscript [ref=f11e1653]:
                  - link "[235]" [ref=f11e1654] [cursor=pointer]:
                    - /url: "#cite_note-236"
                - link "Paul Nakasone" [ref=f11e1656] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paul_Nakasone
                - text: then joined the board of OpenAI.
                - superscript [ref=f11e1657]:
                  - link "[236]" [ref=f11e1658] [cursor=pointer]:
                    - /url: "#cite_note-237"
              - paragraph [ref=f11e1660]:
                - text: In August 2024, cofounder John Schulman left OpenAI to join
                - link "Anthropic" [ref=f11e1661] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anthropic
                - text: ", and OpenAI's president"
                - link "Greg Brockman" [ref=f11e1662] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greg_Brockman
                - text: took extended leave until November.
                - superscript [ref=f11e1663]:
                  - link "[237]" [ref=f11e1664] [cursor=pointer]:
                    - /url: "#cite_note-238"
                - superscript [ref=f11e1666]:
                  - link "[238]" [ref=f11e1667] [cursor=pointer]:
                    - /url: "#cite_note-239"
              - paragraph [ref=f11e1669]:
                - text: In September 2024, CTO
                - link "Mira Murati" [ref=f11e1670] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mira_Murati
                - text: left the company.
                - superscript [ref=f11e1671]:
                  - link "[239]" [ref=f11e1672] [cursor=pointer]:
                    - /url: "#cite_note-240"
                - superscript [ref=f11e1674]:
                  - link "[240]" [ref=f11e1675] [cursor=pointer]:
                    - /url: "#cite_note-241"
              - paragraph [ref=f11e1677]:
                - text: In November 2025,
                - link "Lawrence Summers" [ref=f11e1678] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lawrence_Summers
                - text: resigned from the board of directors.
                - superscript [ref=f11e1679]:
                  - link "[241]" [ref=f11e1680] [cursor=pointer]:
                    - /url: "#cite_note-242"
              - paragraph [ref=f11e1682]:
                - text: In April 2026, OpenAI's head of AGI deployment,
                - link "Fidji Simo" [ref=f11e1683] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fidji_Simo
                - text: ", said she would take \"several weeks\" of medical leave. This triggered a reshuffling of the leadership. Brad Lightcap transitioned from his role as Chief Operating Officer to lead \"special projects\" focused on complex deals, reporting directly to Sam Altman. This includes a potential software distribution joint venture with private equity partners. Denise Dresser, the company's Chief Revenue Officer, temporarily assumed several of Lightcap's previous operational duties, with Greg Brockman taking over the product organization."
                - superscript [ref=f11e1684]:
                  - link "[242]" [ref=f11e1685] [cursor=pointer]:
                    - /url: "#cite_note-243"
          - region [ref=f11e1687]:
            - generic [ref=f11e1688]:
              - heading "Governance and legal issues" [level=2] [ref=f11e1689]
              - generic [ref=f11e1690]:
                - link "edit":
                  - /url: /w/index.php?title=OpenAI&action=edit&section=25
            - figure [ref=f11e1691]:
              - link [ref=f11e1692] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Ilya_Sutskever_and_Sam_Altman_in_TAU.jpg
              - generic [ref=f11e1694]:
                - text: Altman and Sutskever at
                - link "Tel Aviv University" [ref=f11e1695] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tel_Aviv_University
                - text: in 2023
            - paragraph [ref=f11e1696]:
              - text: In May 2023, Sam Altman, Greg Brockman and Ilya Sutskever posted recommendations for the governance of
              - link "superintelligence" [ref=f11e1697] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Superintelligence
              - text: .
              - superscript [ref=f11e1698]:
                - link "[243]" [ref=f11e1699] [cursor=pointer]:
                  - /url: "#cite_note-OpenAI-Governance-244"
              - text: They stated that superintelligence could happen within the next 10 years, allowing a "dramatically more prosperous future" and that "given the possibility of existential risk, we can't just be reactive". They proposed creating an international watchdog organization similar to
              - link "IAEA" [ref=f11e1701] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/International_Atomic_Energy_Agency
              - text: to oversee AI systems above a certain capability threshold, suggesting that relatively weak AI systems, on the other hand, should not be overly regulated. They also called for more technical safety research for superintelligences, and asked for more coordination, for example through governments launching a joint project which "many current efforts become part of".
              - superscript [ref=f11e1702]:
                - link "[243]" [ref=f11e1703] [cursor=pointer]:
                  - /url: "#cite_note-OpenAI-Governance-244"
              - superscript [ref=f11e1705]:
                - link "[244]" [ref=f11e1706] [cursor=pointer]:
                  - /url: "#cite_note-245"
            - paragraph [ref=f11e1708]:
              - text: In July 2023, the
              - link "FTC" [ref=f11e1709] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Federal_Trade_Commission
              - text: issued a
              - link "civil investigative demand" [ref=f11e1710] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Civil_investigative_demand
              - text: to OpenAI to investigate whether the company's
              - link "data security" [ref=f11e1711] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Data_security
              - text: and
              - link "privacy" [ref=f11e1712] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Information_privacy
              - text: practices to develop
              - link "ChatGPT" [ref=f11e1713] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ChatGPT
              - text: were
              - link "unfair" [ref=f11e1714] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unfair_business_practices
              - text: or
              - link "harmed consumers" [ref=f11e1715] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Consumer_protection
              - text: (including by
              - link "reputational harm" [ref=f11e1716] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Defamation
              - text: ) in violation of Section 5 of the
              - link "Federal Trade Commission Act of 1914" [ref=f11e1717] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Federal_Trade_Commission_Act_of_1914
              - text: .
              - superscript [ref=f11e1718]:
                - link "[245]" [ref=f11e1719] [cursor=pointer]:
                  - /url: "#cite_note-246"
              - superscript [ref=f11e1721]:
                - link "[246]" [ref=f11e1722] [cursor=pointer]:
                  - /url: "#cite_note-247"
              - superscript [ref=f11e1724]:
                - link "[247]" [ref=f11e1725] [cursor=pointer]:
                  - /url: "#cite_note-cnbcLeak1-248"
              - text: These are typically preliminary investigative matters and are nonpublic, but the FTC's document was leaked.
              - superscript [ref=f11e1727]:
                - link "[248]" [ref=f11e1728] [cursor=pointer]:
                  - /url: "#cite_note-249"
              - superscript [ref=f11e1730]:
                - link "[247]" [ref=f11e1731] [cursor=pointer]:
                  - /url: "#cite_note-cnbcLeak1-248"
              - text: They asked OpenAI for comprehensive information about its technology and privacy safeguards, as well as any steps taken to prevent the recurrence of situations in which its chatbot generated false and disparaging content about people.
              - superscript [ref=f11e1733]:
                - link "[249]" [ref=f11e1734] [cursor=pointer]:
                  - /url: "#cite_note-250"
              - text: The agency also raised concerns about 'circular' spending arrangements—for example, Microsoft extending Azure credits to OpenAI while both companies shared engineering talent—and warned that such structures could negatively affect the public.
              - superscript [ref=f11e1736]:
                - link "[250]" [ref=f11e1737] [cursor=pointer]:
                  - /url: "#cite_note-bloom1AIMicro-251"
            - paragraph [ref=f11e1739]:
              - text: In September 2024, OpenAI's global affairs chief endorsed the UK's "smart" AI regulation during testimony to a
              - link "House of Lords" [ref=f11e1740] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/House_of_Lords
              - text: committee.
              - superscript [ref=f11e1741]:
                - link "[251]" [ref=f11e1742] [cursor=pointer]:
                  - /url: "#cite_note-252"
            - paragraph [ref=f11e1744]:
              - text: In February 2025, OpenAI CEO
              - link "Sam Altman" [ref=f11e1745] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sam_Altman
              - text: stated that the company is interested in collaborating with the
              - link "People's Republic of China" [ref=f11e1746] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/People's_Republic_of_China
              - text: ", despite"
              - link "regulatory restrictions imposed by the U.S. government" [ref=f11e1747] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/United_States_sanctions_against_China
              - text: .
              - superscript [ref=f11e1748]:
                - link "[252]" [ref=f11e1749] [cursor=pointer]:
                  - /url: "#cite_note-253"
              - text: This shift comes in response to the growing influence of the Chinese artificial intelligence company
              - link "DeepSeek" [ref=f11e1751] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DeepSeek
              - text: ", which has disrupted the AI market with open models, including DeepSeek V3 and DeepSeek R1."
              - superscript [ref=f11e1752]:
                - link "[253]" [ref=f11e1753] [cursor=pointer]:
                  - /url: "#cite_note-254"
              - superscript [ref=f11e1755]:
                - link "[254]" [ref=f11e1756] [cursor=pointer]:
                  - /url: "#cite_note-255"
              - text: Following DeepSeek's market emergence, OpenAI enhanced security protocols to protect proprietary development techniques from
              - link "industrial espionage" [ref=f11e1758] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Industrial_espionage
              - text: . Some industry observers noted similarities between DeepSeek's model
              - link "distillation" [ref=f11e1759] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Knowledge_distillation
              - text: approach and OpenAI's methodology, though no formal intellectual property claim was filed.
              - superscript [ref=f11e1760]:
                - link "[255]" [ref=f11e1761] [cursor=pointer]:
                  - /url: "#cite_note-256"
            - paragraph [ref=f11e1763]:
              - text: According to Oliver Roberts, in March 2025, the United States had 781 state AI bills or laws. OpenAI advocated for
              - link "preempting" [ref=f11e1764] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Federal_preemption
              - text: state AI laws with federal laws.
              - superscript [ref=f11e1765]:
                - link "[256]" [ref=f11e1766] [cursor=pointer]:
                  - /url: "#cite_note-roberts2025-257"
              - text: According to Scott Kohler, OpenAI has opposed California's AI legislation and suggested that the state bill encroaches on a more competent federal government.
              - superscript [ref=f11e1768]:
                - link "[257]" [ref=f11e1769] [cursor=pointer]:
                  - /url: "#cite_note-258"
              - link "Public Citizen" [ref=f11e1771] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Public_Citizen
              - text: opposed a federal preemption on AI and pointed to OpenAI's growth and valuation as evidence that existing state laws have not hampered
              - link "innovation" [ref=f11e1772] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Innovation
              - text: .
              - superscript [ref=f11e1773]:
                - link "[258]" [ref=f11e1774] [cursor=pointer]:
                  - /url: "#cite_note-259"
            - paragraph [ref=f11e1776]:
              - text: In early 2026, OpenAI provided the entire initial funding for the
              - link "Parents & Kids Safe AI Coalition" [ref=f11e1777] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Parents_&_Kids_Safe_AI_Coalition
              - text: . Several organizations contacted on behalf of the coalition reported being unaware of OpenAI's involvement.
              - superscript [ref=f11e1778]:
                - link "[259]" [ref=f11e1779] [cursor=pointer]:
                  - /url: "#cite_note-260"
            - region [ref=f11e1781]:
              - generic [ref=f11e1782]:
                - heading "Non-disparagement agreements" [level=3] [ref=f11e1783]
                - generic [ref=f11e1784]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=26
              - paragraph [ref=f11e1785]:
                - text: Before May 2024, OpenAI required departing employees to sign a lifelong
                - link "non-disparagement agreement" [ref=f11e1786] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Non-disclosure_agreement
                - text: forbidding them from criticizing OpenAI or acknowledging the existence of the agreement.
                - link "Daniel Kokotajlo" [ref=f11e1787] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Daniel_Kokotajlo_(researcher)
                - text: ", a former employee, publicly stated that he forfeited his vested equity in OpenAI in order to leave without signing the agreement."
                - superscript [ref=f11e1788]:
                  - link "[260]" [ref=f11e1789] [cursor=pointer]:
                    - /url: "#cite_note-261"
                - superscript [ref=f11e1791]:
                  - link "[261]" [ref=f11e1792] [cursor=pointer]:
                    - /url: "#cite_note-262"
                - text: Sam Altman stated that he was unaware of the equity cancellation provision, and that OpenAI never enforced it to cancel any employee's vested equity.
                - superscript [ref=f11e1794]:
                  - link "[262]" [ref=f11e1795] [cursor=pointer]:
                    - /url: "#cite_note-263"
                - text: However, leaked documents and emails refute this claim.
                - superscript [ref=f11e1797]:
                  - link "[263]" [ref=f11e1798] [cursor=pointer]:
                    - /url: "#cite_note-264"
                - text: On May 23, 2024, OpenAI sent a memo releasing former employees from the agreement.
                - superscript [ref=f11e1800]:
                  - link "[264]" [ref=f11e1801] [cursor=pointer]:
                    - /url: "#cite_note-265"
            - region [ref=f11e1803]:
              - generic [ref=f11e1804]:
                - heading "Copyright" [level=3] [ref=f11e1805]
                - generic [ref=f11e1806]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=27
              - paragraph [ref=f11e1807]:
                - text: OpenAI was sued for
                - link "copyright infringement" [ref=f11e1808] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Copyright_infringement
                - text: by authors
                - link "Sarah Silverman" [ref=f11e1809] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sarah_Silverman
                - text: ","
                - link "Matthew Butterick" [ref=f11e1810] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Matthew_Butterick
                - text: ","
                - link "Paul Tremblay" [ref=f11e1811] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paul_G._Tremblay
                - text: and
                - link "Mona Awad" [ref=f11e1812] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mona_Awad
                - text: in July 2023.
                - superscript [ref=f11e1813]:
                  - link "[265]" [ref=f11e1814] [cursor=pointer]:
                    - /url: "#cite_note-266"
                - superscript [ref=f11e1816]:
                  - link "[266]" [ref=f11e1817] [cursor=pointer]:
                    - /url: "#cite_note-Krithika-2023-267"
                - superscript [ref=f11e1819]:
                  - link "[267]" [ref=f11e1820] [cursor=pointer]:
                    - /url: "#cite_note-268"
                - text: In September 2023, 17 authors, including
                - link "George R. R. Martin" [ref=f11e1822] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/George_R._R._Martin
                - text: ","
                - link "John Grisham" [ref=f11e1823] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Grisham
                - text: ","
                - link "Jodi Picoult" [ref=f11e1824] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jodi_Picoult
                - text: and
                - link "Jonathan Franzen" [ref=f11e1825] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jonathan_Franzen
                - text: ", joined the"
                - link "Authors Guild" [ref=f11e1826] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Authors_Guild
                - text: in filing a class action lawsuit against OpenAI, alleging that the company's technology was illegally using their copyrighted work.
                - superscript [ref=f11e1827]:
                  - link "[268]" [ref=f11e1828] [cursor=pointer]:
                    - /url: "#cite_note-269"
                - superscript [ref=f11e1830]:
                  - link "[269]" [ref=f11e1831] [cursor=pointer]:
                    - /url: "#cite_note-270"
                - text: The
                - link "New York Times" [ref=f11e1834] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_York_Times
                - text: also sued the company in late December 2023.
                - superscript [ref=f11e1835]:
                  - link "[266]" [ref=f11e1836] [cursor=pointer]:
                    - /url: "#cite_note-Krithika-2023-267"
                - superscript [ref=f11e1838]:
                  - link "[270]" [ref=f11e1839] [cursor=pointer]:
                    - /url: "#cite_note-271"
                - text: In May 2024 it was revealed that OpenAI had destroyed its Books1 and Books2 training datasets, which were used in the
                - link "training of GPT-3" [ref=f11e1841] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GPT-3#Training_and_capabilities
                - text: ", and which the Authors Guild believed to have contained over 100,000 copyrighted books."
                - superscript [ref=f11e1842]:
                  - link "[271]" [ref=f11e1843] [cursor=pointer]:
                    - /url: "#cite_note-272"
              - paragraph [ref=f11e1845]:
                - text: In 2021, OpenAI developed a
                - link "speech recognition" [ref=f11e1846] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Speech_recognition
                - text: tool called Whisper. OpenAI used it to transcribe more than one million hours of YouTube videos into text for training GPT-4. The automated transcription of YouTube videos raised concerns within OpenAI employees regarding potential violations of YouTube's terms of service, which prohibit the use of videos for applications independent of the platform, as well as any type of automated access to its videos. Despite these concerns, the project proceeded with notable involvement from OpenAI's president,
                - link "Greg Brockman" [ref=f11e1847] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Greg_Brockman
                - text: . The resulting dataset proved instrumental in training GPT-4.
                - superscript [ref=f11e1848]:
                  - link "[272]" [ref=f11e1849] [cursor=pointer]:
                    - /url: "#cite_note-273"
              - paragraph [ref=f11e1851]:
                - text: In February 2024,
                - link "The Intercept" [ref=f11e1853] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Intercept
                - text: as well as
                - link "Raw Story" [ref=f11e1855] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Raw_Story
                - text: and Alternate Media Inc. filed lawsuit against OpenAI on copyright litigation ground.
                - superscript [ref=f11e1856]:
                  - link "[273]" [ref=f11e1857] [cursor=pointer]:
                    - /url: "#cite_note-274"
                - superscript [ref=f11e1859]:
                  - link "[274]" [ref=f11e1860] [cursor=pointer]:
                    - /url: "#cite_note-275"
                - text: The lawsuit is said to have charted a new legal strategy for digital-only publishers to sue OpenAI.
                - superscript [ref=f11e1862]:
                  - link "[275]" [ref=f11e1863] [cursor=pointer]:
                    - /url: "#cite_note-276"
              - paragraph [ref=f11e1865]:
                - text: On April 30, 2024, eight newspapers filed a lawsuit in the
                - link "Southern District of New York" [ref=f11e1866] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_Attorney_for_the_Southern_District_of_New_York
                - text: against OpenAI and Microsoft, claiming illegal harvesting of their copyrighted articles. The suing publications included
                - link "The Mercury News" [ref=f11e1868] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Mercury_News
                - text: ","
                - link "The Denver Post" [ref=f11e1870] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Denver_Post
                - text: ","
                - link "The Orange County Register" [ref=f11e1872] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Orange_County_Register
                - text: ","
                - link "St. Paul Pioneer Press" [ref=f11e1874] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/St._Paul_Pioneer_Press
                - text: ","
                - link "Chicago Tribune" [ref=f11e1876] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chicago_Tribune
                - text: ","
                - link "Orlando Sentinel" [ref=f11e1878] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Orlando_Sentinel
                - text: ","
                - link "Sun Sentinel" [ref=f11e1880] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sun_Sentinel
                - text: ", and"
                - link "New York Daily News" [ref=f11e1882] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_York_Daily_News
                - text: .
                - superscript [ref=f11e1883]:
                  - link "[276]" [ref=f11e1884] [cursor=pointer]:
                    - /url: "#cite_note-ebt-30apr2024-277"
              - paragraph [ref=f11e1886]:
                - text: In June 2023, a lawsuit claimed that OpenAI
                - link "scraped" [ref=f11e1887] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Web_scraping
                - text: 300 billion words online without consent and without registering as a data broker. It was filed in
                - link "San Francisco" [ref=f11e1888] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/San_Francisco
                - text: ","
                - link "California" [ref=f11e1889] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/California
                - text: ", by sixteen anonymous plaintiffs."
                - superscript [ref=f11e1890]:
                  - link "[277]" [ref=f11e1891] [cursor=pointer]:
                    - /url: "#cite_note-278"
                - text: They also claimed that OpenAI and its partner as well as customer
                - link "Microsoft" [ref=f11e1893] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft
                - text: continued to unlawfully collect and use personal data from millions of consumers worldwide to train artificial intelligence models.
                - superscript [ref=f11e1894]:
                  - link "[278]" [ref=f11e1895] [cursor=pointer]:
                    - /url: "#cite_note-279"
              - paragraph [ref=f11e1897]:
                - text: On May 22, 2024, OpenAI entered into an agreement with
                - link "News Corp" [ref=f11e1898] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/News_Corp
                - text: to integrate news content from
                - link "The Wall Street Journal" [ref=f11e1900] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Wall_Street_Journal
                - text: ", the"
                - link "New York Post" [ref=f11e1902] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_York_Post
                - text: ","
                - link "The Times" [ref=f11e1904] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Times
                - text: ", and"
                - link "The Sunday Times" [ref=f11e1906] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Sunday_Times
                - text: into its AI platform. Meanwhile, other publications like
                - link "The New York Times" [ref=f11e1908] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_New_York_Times
                - text: chose to sue OpenAI and
                - link "Microsoft" [ref=f11e1909] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft
                - text: for copyright infringement over the use of their content to train AI models.
                - superscript [ref=f11e1910]:
                  - link "[279]" [ref=f11e1911] [cursor=pointer]:
                    - /url: "#cite_note-280"
                - text: In November 2024, a coalition of Canadian news outlets, including the
                - link "Toronto Star" [ref=f11e1913] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Toronto_Star
                - text: ","
                - link "Metroland Media" [ref=f11e1914] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Metroland_Media_Group
                - text: ","
                - link "Postmedia" [ref=f11e1915] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Postmedia_Network
                - text: ","
                - link "The Globe and Mail" [ref=f11e1916] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Globe_and_Mail
                - text: ","
                - link "The Canadian Press" [ref=f11e1917] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Canadian_Press
                - text: and
                - link "CBC" [ref=f11e1918] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/CBC_News
                - text: ", sued OpenAI for using their news articles to train its software without permission."
                - superscript [ref=f11e1919]:
                  - link "[280]" [ref=f11e1920] [cursor=pointer]:
                    - /url: "#cite_note-281"
              - paragraph [ref=f11e1922]:
                - text: In October 2024 during a New York Times interview,
                - link "Suchir Balaji" [ref=f11e1923] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Suchir_Balaji
                - text: accused OpenAI of violating copyright law in developing its commercial LLMs which he had helped engineer. He was a likely witness in a major copyright trial against the AI company, and was one of several of its current or former employees named in court filings as potentially having documents relevant to the case. On November 26, 2024, Balaji died by suicide. His death prompted the circulation of
                - link "conspiracy theories" [ref=f11e1924] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Conspiracy_theories
                - text: alleging that he had been deliberately silenced.
                - superscript [ref=f11e1925]:
                  - link "[281]" [ref=f11e1926] [cursor=pointer]:
                    - /url: "#cite_note-sf-standard-282"
                - superscript [ref=f11e1928]:
                  - link "[282]" [ref=f11e1929] [cursor=pointer]:
                    - /url: "#cite_note-Mercury-jan-31-283"
                - text: California Congressman
                - link "Ro Khanna" [ref=f11e1931] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ro_Khanna
                - text: endorsed calls for an investigation.
                - superscript [ref=f11e1932]:
                  - link "[283]" [ref=f11e1933] [cursor=pointer]:
                    - /url: "#cite_note-rokhanna-284"
                - superscript [ref=f11e1935]:
                  - link "[284]" [ref=f11e1936] [cursor=pointer]:
                    - /url: "#cite_note-sfexaminer-jan-23-285"
              - paragraph [ref=f11e1938]:
                - text: On April 24, 2025,
                - link "Ziff Davis" [ref=f11e1939] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ziff_Davis
                - text: sued OpenAI in
                - link "Delaware federal court" [ref=f11e1940] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/District_of_Delaware
                - text: for copyright infringement. Ziff Davis is known for publications such as
                - link "ZDNet" [ref=f11e1941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ZDNet
                - text: ","
                - link "PCMag" [ref=f11e1942] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PCMag
                - text: ","
                - link "CNET" [ref=f11e1943] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/CNET
                - text: ","
                - link "IGN" [ref=f11e1944] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGN
                - text: and
                - link "Lifehacker" [ref=f11e1945] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lifehacker
                - text: .
                - superscript [ref=f11e1946]:
                  - link "[285]" [ref=f11e1947] [cursor=pointer]:
                    - /url: "#cite_note-286"
                - superscript [ref=f11e1949]:
                  - link "[286]" [ref=f11e1950] [cursor=pointer]:
                    - /url: "#cite_note-287"
                - text: On June 24, 2026, a group of local newspaper publishers also sued OpenAI and Microsoft for copyright infringement.
                - superscript [ref=f11e1952]:
                  - link "[287]" [ref=f11e1953] [cursor=pointer]:
                    - /url: "#cite_note-288"
            - region [ref=f11e1955]:
              - generic [ref=f11e1956]:
                - heading "GDPR compliance" [level=3] [ref=f11e1957]
                - generic [ref=f11e1958]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=28
              - paragraph [ref=f11e1959]:
                - text: In April 2023, the EU's
                - link "European Data Protection Board" [ref=f11e1960] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/European_Data_Protection_Board
                - text: (EDPB) formed a dedicated task force on ChatGPT "to foster cooperation and to exchange information on possible enforcement actions conducted by data protection authorities" based on the "enforcement action undertaken by the Italian data protection authority against OpenAI about the ChatGPT service".
                - superscript [ref=f11e1961]:
                  - link "[288]" [ref=f11e1962] [cursor=pointer]:
                    - /url: "#cite_note-289"
              - paragraph [ref=f11e1964]:
                - text: In late April 2024
                - link "NOYB" [ref=f11e1965] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/NOYB
                - text: filed a complaint with the
                - link "Austrian" [ref=f11e1966] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Austria
                - text: Datenschutzbehörde against OpenAI for violating the European
                - link "General Data Protection Regulation" [ref=f11e1967] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/General_Data_Protection_Regulation
                - text: . A text created with ChatGPT gave a false
                - link "date of birth" [ref=f11e1968] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Date_of_birth
                - text: for a living person without giving the individual the option to see the personal data used in the process. A request to correct the mistake was denied. Additionally, neither the recipients of ChatGPT's work nor the sources used, could be made available, OpenAI claimed.
                - superscript [ref=f11e1969]:
                  - link "[289]" [ref=f11e1970] [cursor=pointer]:
                    - /url: "#cite_note-290"
              - paragraph [ref=f11e1972]:
                - text: In Europe, OpenAI operates as OpenAI
                - link "Ireland" [ref=f11e1973] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ireland
                - text: Ltd for residents in the
                - link "EEA" [ref=f11e1974] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/EEA
                - text: or
                - link "Switzerland" [ref=f11e1975] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Switzerland
                - text: and OpenAI OpCo, LLC, a
                - link "Delaware" [ref=f11e1976] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Delaware
                - text: company for residents in the
                - link "UK" [ref=f11e1977] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/UK
                - text: like in the
                - link "US" [ref=f11e1978] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/US
                - text: .
                - superscript [ref=f11e1979]:
                  - link "[290]" [ref=f11e1980] [cursor=pointer]:
                    - /url: "#cite_note-291"
            - region [ref=f11e1982]:
              - generic [ref=f11e1983]:
                - heading "Military and warfare" [level=3] [ref=f11e1984]
                - generic [ref=f11e1985]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=29
              - paragraph [ref=f11e1986]:
                - text: OpenAI has been criticized for allowing ChatGPT to be used for "military and warfare" since January 10, 2024, when its "usage policies" removed the ban on "activity that has high risk of physical harm, including", specifically, "weapons development" and "military and warfare". Its new policies prohibit "[using] our service to harm yourself or others" and to "develop or use weapons".
                - superscript [ref=f11e1987]:
                  - link "[291]" [ref=f11e1988] [cursor=pointer]:
                    - /url: "#cite_note-292"
                - superscript [ref=f11e1990]:
                  - link "[292]" [ref=f11e1991] [cursor=pointer]:
                    - /url: "#cite_note-293"
            - region [ref=f11e1993]:
              - generic [ref=f11e1994]:
                - heading "Litigation involving Elon Musk" [level=3] [ref=f11e1995]
                - generic [ref=f11e1996]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=30
              - note [ref=f11e1997]:
                - text: "Main article:"
                - link "Musk v. Altman" [ref=f11e1998] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Musk_v._Altman
              - paragraph [ref=f11e1999]:
                - text: On February 29, 2024,
                - link "Elon Musk" [ref=f11e2000] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Elon_Musk
                - text: filed a lawsuit against OpenAI and CEO Sam Altman, accusing them of shifting focus from public benefit to profit maximization—a case OpenAI dismissed as "incoherent" and "frivolous", though Musk later revived legal action against Altman and others in August.
                - superscript [ref=f11e2001]:
                  - link "[293]" [ref=f11e2002] [cursor=pointer]:
                    - /url: "#cite_note-294"
                - superscript [ref=f11e2004]:
                  - link "[294]" [ref=f11e2005] [cursor=pointer]:
                    - /url: "#cite_note-295"
                - superscript [ref=f11e2007]:
                  - link "[295]" [ref=f11e2008] [cursor=pointer]:
                    - /url: "#cite_note-296"
                - superscript [ref=f11e2010]:
                  - link "[296]" [ref=f11e2011] [cursor=pointer]:
                    - /url: "#cite_note-297"
              - paragraph [ref=f11e2013]:
                - text: On April 9, 2024, OpenAI countersued Musk in federal court, alleging that he had engaged in "bad-faith tactics" to slow the company's progress and seize its innovations for his personal benefit. OpenAI also argued that Musk had previously supported the creation of a for-profit structure and had expressed interest in controlling OpenAI himself. The countersuit seeks damages and legal measures to prevent further alleged interference.
                - superscript [ref=f11e2014]:
                  - link "[297]" [ref=f11e2015] [cursor=pointer]:
                    - /url: "#cite_note-298"
              - paragraph [ref=f11e2017]:
                - text: Musk amended his filing on April 7, 2026, to demand that OpenAI undo its transition from a non-profit to a for-profit corporate structure.
                - superscript [ref=f11e2018]:
                  - link "[54]" [ref=f11e2019] [cursor=pointer]:
                    - /url: "#cite_note-Belanger-2026-55"
              - paragraph [ref=f11e2021]:
                - text: The jury for the case against OpenAI, Altman and Greg Brockman was seated on April 27, 2026.
                - superscript [ref=f11e2022]:
                  - link "[298]" [ref=f11e2023] [cursor=pointer]:
                    - /url: "#cite_note-299"
                - superscript [ref=f11e2025]:
                  - link "[299]" [ref=f11e2026] [cursor=pointer]:
                    - /url: "#cite_note-300"
                - text: On April 28, 2026, trial testimony was underway, with Elon Musk beginning his testimony against Altman and OpenAI.
                - superscript [ref=f11e2028]:
                  - link "[300]" [ref=f11e2029] [cursor=pointer]:
                    - /url: "#cite_note-301"
                - text: On April 30, 2026 Musk would enter his third day of testimony.
                - superscript [ref=f11e2031]:
                  - link "[301]" [ref=f11e2032] [cursor=pointer]:
                    - /url: "#cite_note-302"
              - paragraph [ref=f11e2034]:
                - text: On May 18, 2026, following a federal jury verdict in favor of OpenAI, Sam Altman, Greg Brockman and Microsoft in Musk v. Altman, Elon Musk's attorney
                - link "Marc Toberoff" [ref=f11e2035] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marc_Toberoff
                - text: announced that Musk would appeal the decision, stating that "the war is not over."
                - superscript [ref=f11e2036]:
                  - link "[302]" [ref=f11e2037] [cursor=pointer]:
                    - /url: "#cite_note-303"
            - region [ref=f11e2039]:
              - generic [ref=f11e2040]:
                - heading "Wrongful-death lawsuits over ChatGPT safety (2025)" [level=3] [ref=f11e2041]
                - generic [ref=f11e2042]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=31
              - note [ref=f11e2043]:
                - text: "Main article:"
                - link "Raine v. OpenAI" [ref=f11e2044] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Raine_v._OpenAI
              - note [ref=f11e2045]:
                - text: "See also:"
                - link "Deaths linked to chatbots" [ref=f11e2046] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deaths_linked_to_chatbots
              - paragraph [ref=f11e2047]:
                - text: In August 2025, the parents of a 16-year-old boy who died by suicide filed a
                - link "wrongful death lawsuit" [ref=f11e2048] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wrongful_death_claim
                - text: ","
                - link "Raine v. OpenAI" [ref=f11e2050] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Raine_v._OpenAI
                - text: ", against the company (and CEO Sam Altman), alleging that months of conversations with ChatGPT about mental health and methods of self-harm contributed to their son's death and that safeguards were inadequate for minors. OpenAI expressed condolences and said it was strengthening protections (including updated crisis response behavior and parental controls). Coverage described it as a first-of-its-kind wrongful death case targeting the company's chatbot. The complaint was filed in California state court in San Francisco."
                - superscript [ref=f11e2051]:
                  - link "[303]" [ref=f11e2052] [cursor=pointer]:
                    - /url: "#cite_note-304"
              - paragraph [ref=f11e2054]:
                - text: In November 2025, the Social Media Victims Law Center and Tech Justice Law Project filed seven lawsuits against OpenAI, of which four lawsuits alleged wrongful death.
                - superscript [ref=f11e2055]:
                  - link "[304]" [ref=f11e2056] [cursor=pointer]:
                    - /url: "#cite_note-305"
                - text: The suits were filed on behalf of
                - link "Zane Shamblin" [ref=f11e2058] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deaths_linked_to_chatbots#Suicide_of_Zane_Shamblin
                - text: ", 23, of Texas;"
                - link "Amaurie Lacey" [ref=f11e2059] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deaths_linked_to_chatbots#Suicide_of_Amaurie_Lacey
                - text: ", 17, of Georgia;"
                - link "Joshua Enneking" [ref=f11e2060] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deaths_linked_to_chatbots#Suicide_of_Joshua_Enneking
                - text: ", 26, of Florida; and"
                - link "Joe Ceccanti" [ref=f11e2061] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deaths_linked_to_chatbots#Suicide_of_Joe_Ceccanti
                - text: ", 48, of Oregon, who each committed suicide after prolonged ChatGPT usage."
                - superscript [ref=f11e2062]:
                  - link "[305]" [ref=f11e2063] [cursor=pointer]:
                    - /url: "#cite_note-306"
              - region [ref=f11e2065]:
                - generic [ref=f11e2066]:
                  - heading "Murder of Suzanne Adams" [level=4] [ref=f11e2067]
                  - generic [ref=f11e2068]:
                    - link "edit":
                      - /url: /w/index.php?title=OpenAI&action=edit&section=32
                - note [ref=f11e2069]:
                  - text: "Main article:"
                  - link "Murder of Suzanne Adams" [ref=f11e2070] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Murder_of_Suzanne_Adams
                - paragraph [ref=f11e2071]:
                  - text: In December 2025, after Suzanne Adams was murdered by her 56-year-old son,
                  - link "First County Bank" [ref=f11e2072] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/First_County_Bank
                  - text: ", the executor of Adams's estate, filed a lawsuit against OpenAI. The lawsuit alleges that over months of conversations, ChatGPT validated her son's many paranoid beliefs, such as that his mother was spying on him and that she attempted to poison him using drugs siphoned through his car air vents. OpenAI said they would make ChatGPT safer for users disconnected from reality."
                  - superscript [ref=f11e2073]:
                    - link "[306]" [ref=f11e2074] [cursor=pointer]:
                      - /url: "#cite_note-:0-307"
                  - superscript [ref=f11e2076]:
                    - link "[307]" [ref=f11e2077] [cursor=pointer]:
                      - /url: "#cite_note-308"
            - region [ref=f11e2079]:
              - generic [ref=f11e2080]:
                - heading "2026 Canadian mass shooting" [level=3] [ref=f11e2081]
                - generic [ref=f11e2082]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=33
              - paragraph [ref=f11e2083]:
                - text: After 8 victims were killed on February 10, 2026, in
                - link "mass shootings in Tumbler Ridge, British Columbia" [ref=f11e2084] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2026_Tumbler_Ridge_shooting
                - text: ", it emerged that OpenAI had banned an account belonging to the perpetrator due to violent queries approximately 7 months prior to the attacks. OpenAI opted not to report the account to authorities at the time."
                - superscript [ref=f11e2085]:
                  - link "[308]" [ref=f11e2086] [cursor=pointer]:
                    - /url: "#cite_note-309"
                - superscript [ref=f11e2088]:
                  - link "[309]" [ref=f11e2089] [cursor=pointer]:
                    - /url: "#cite_note-310"
              - paragraph [ref=f11e2091]:
                - text: The
                - link "Wall Street Journal" [ref=f11e2093] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wall_Street_Journal
                - text: reported that the perpetrator "described scenarios [to ChatGPT] involving gun violence over the course of several days", and that these messages were "flagged by an automated review system" and "alarmed employees at OpenAI". A dozen employees debated whether to take action, some urging leaders to alert Canadian law enforcement.
                - superscript [ref=f11e2094]:
                  - link "[310]" [ref=f11e2095] [cursor=pointer]:
                    - /url: "#cite_note-311"
                - superscript [ref=f11e2097]:
                  - link "[311]" [ref=f11e2098] [cursor=pointer]:
                    - /url: "#cite_note-312"
              - paragraph [ref=f11e2100]:
                - text: Canadian officials summoned OpenAI's safety team to Ottawa, criticizing their escalation protocols. The meeting highlighted concerns about how and when OpenAI reports potentially dangerous user behavior to authorities and intensified scrutiny of its safety-oversight processes.
                - superscript [ref=f11e2101]:
                  - link "[312]" [ref=f11e2102] [cursor=pointer]:
                    - /url: "#cite_note-313"
                - text: On February 23,
                - link "BC" [ref=f11e2104] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/British_Columbia
                - text: Premier
                - link "David Eby" [ref=f11e2105] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/David_Eby
                - text: said, "From the outside, it looks like OpenAI had the opportunity to prevent this tragedy, to prevent this horrific loss of life, to prevent there from being dead children in British Columbia".
                - superscript [ref=f11e2106]:
                  - link "[313]" [ref=f11e2107] [cursor=pointer]:
                    - /url: "#cite_note-eby-solomon-314"
                - text: Canada's federal AI Minister
                - link "Evan Solomon" [ref=f11e2109] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Evan_Solomon
                - text: said, "I want [OpenAI] to give us details of what their protocols are, [and] what they are specifically in Canada".
                - superscript [ref=f11e2110]:
                  - link "[313]" [ref=f11e2111] [cursor=pointer]:
                    - /url: "#cite_note-eby-solomon-314"
            - region [ref=f11e2113]:
              - generic [ref=f11e2114]:
                - heading "Stalking lawsuit" [level=3] [ref=f11e2115]
                - generic [ref=f11e2116]:
                  - link "edit":
                    - /url: /w/index.php?title=OpenAI&action=edit&section=34
              - paragraph [ref=f11e2117]:
                - text: In 2026, a woman filed a lawsuit against OpenAI, alleging that ChatGPT played a role in enabling a prolonged stalking campaign against her. According to the complaint, her former partner became increasingly fixated and used the chatbot to generate messages and content that reinforced his behavior, including harassing and defamatory material. The plaintiff claimed that she had contacted OpenAI to report the issue, but that the company did not take adequate action to prevent further misuse. The case has been cited as part of growing legal and public debate over the responsibility of AI companies to address harmful or abusive uses of their systems.
                - superscript [ref=f11e2118]:
                  - link "[314]" [ref=f11e2119] [cursor=pointer]:
                    - /url: "#cite_note-315"
